<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Ralphie's Roam</title>
<meta name="description" content="Explore the CU Boulder campus on foot and clear the fog of war.">
<meta name="theme-color" content="#0d0f14">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Ralphie's Roam">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
:root{
  --bg:#0d0f14; --panel:#151821; --card:#1d212c; --line:#2a2f3d;
  --text:#eef0f4; --muted:#98a0b3; --gold:#CFB87C; --gold2:#e9d9a8;
  --blue:#3b9dff; --green:#4cd38a; --red:#ff6b6b; --peek:190px;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);
  font:15px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  overscroll-behavior:none;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
#app{display:flex;height:100vh;height:100dvh;width:100%}
#mapwrap{position:relative;flex:1;min-width:0}
#map{position:absolute;inset:0;background:#0b0d11}

/* ---------- panel ---------- */
#panel{width:350px;flex:none;background:var(--panel);border-right:1px solid var(--line);
  display:flex;flex-direction:column;z-index:1100}
#handle{display:none}
.brand{display:flex;align-items:center;gap:10px;padding:14px 16px 6px}
.brand .logo{width:34px;height:34px;border-radius:9px;background:var(--gold);color:#111;
  display:grid;place-items:center;font-weight:800;font-size:18px}
.brand h1{font-size:17px;margin:0;letter-spacing:.2px}
.brand small{display:block;color:var(--muted);font-size:12px;font-weight:400}
.peek{padding:8px 16px 12px}
#trackBtn{width:100%;padding:14px 16px;border-radius:14px;background:var(--gold);color:#14110a;
  font-weight:800;font-size:16px;display:flex;align-items:center;justify-content:center;gap:10px;
  box-shadow:0 4px 18px rgba(207,184,124,.25);transition:transform .1s}
#trackBtn:active{transform:scale(.98)}
#trackBtn .dot{width:11px;height:11px;border-radius:50%;background:#14110a;opacity:.55}
#trackBtn.on{background:#16324f;color:#dff0ff;box-shadow:0 0 0 2px var(--blue) inset}
#trackBtn.on .dot{background:var(--blue);opacity:1;animation:blink 1.2s infinite}
@keyframes blink{50%{opacity:.25}}
.mini{display:flex;gap:8px;margin-top:10px}
.mini div{flex:1;background:var(--card);border-radius:10px;padding:7px 8px;text-align:center}
.mini b{display:block;font-size:16px;font-variant-numeric:tabular-nums}
.mini span{font-size:10.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.6px}
.tabs{display:flex;border-bottom:1px solid var(--line);padding:0 8px}
.tabs button{flex:1;padding:11px 4px;color:var(--muted);font-weight:600;font-size:13.5px;
  border-bottom:2px solid transparent}
.tabs button.act{color:var(--gold);border-color:var(--gold)}
.tabbody{flex:1;overflow-y:auto;padding:12px 12px calc(16px + env(safe-area-inset-bottom));-webkit-overflow-scrolling:touch}
.tabbody>section{display:none}
.tabbody>section.act{display:block}

.zone{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--card);
  border-radius:14px;padding:11px 12px;margin-bottom:9px;border:1px solid transparent}
.zone:active{border-color:var(--gold)}
.zone h3{margin:0;font-size:15px}
.zone p{margin:2px 0 0;font-size:12.5px;color:var(--muted)}
.ring{flex:none;width:54px;height:54px;position:relative}
.ring svg{transform:rotate(-90deg)}
.ring span{position:absolute;inset:0;display:grid;place-items:center;font-size:12px;font-weight:700}
.done h3::after{content:" ✓";color:var(--green)}

.badges{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.badge{background:var(--card);border-radius:14px;padding:12px 10px;text-align:center;opacity:.45;
  border:1px solid transparent}
.badge.got{opacity:1;border-color:rgba(207,184,124,.55)}
.badge .ic{font-size:28px;filter:grayscale(1)}
.badge.got .ic{filter:none}
.badge b{display:block;font-size:13.5px;margin-top:4px}
.badge small{color:var(--muted);font-size:11.5px;display:block;margin-top:2px}

.stat{display:flex;justify-content:space-between;align-items:baseline;background:var(--card);
  padding:11px 13px;border-radius:12px;margin-bottom:8px}
.stat span{color:var(--muted);font-size:13px}
.stat b{font-size:17px;font-variant-numeric:tabular-nums}
.bar{height:8px;background:var(--line);border-radius:8px;overflow:hidden;margin:6px 0 14px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--gold),var(--gold2));border-radius:8px;transition:width .4s}
.lvl{display:flex;justify-content:space-between;font-size:13px;color:var(--muted)}
.lvl b{color:var(--gold)}
.row{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.btn{flex:1;padding:10px 12px;border-radius:10px;background:var(--card);border:1px solid var(--line);
  font-size:13.5px;font-weight:600;white-space:nowrap}
.btn.danger{color:var(--red)}
.note{color:var(--muted);font-size:12px;margin:12px 2px 0}

/* ---------- map chrome ---------- */
#status{position:absolute;top:calc(10px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);
  z-index:1000;background:rgba(13,15,20,.88);backdrop-filter:blur(6px);border:1px solid var(--line);
  padding:6px 13px;border-radius:20px;font-size:12.5px;font-weight:600;white-space:nowrap;
  display:flex;align-items:center;gap:7px;max-width:72%;overflow:hidden;text-overflow:ellipsis}
#status i{width:8px;height:8px;border-radius:50%;background:var(--muted);flex:none}
#status.ok i{background:var(--green)} #status.warn i{background:#ffb84d}
#status.bad i{background:var(--red)} #status.sim i{background:#c08bff}
#fabs{position:absolute;right:10px;bottom:calc(26px + env(safe-area-inset-bottom));z-index:1000;
  display:flex;flex-direction:column;gap:9px}
.fab{width:46px;height:46px;border-radius:50%;background:rgba(21,24,33,.94);border:1px solid var(--line);
  font-size:20px;display:grid;place-items:center;box-shadow:0 3px 10px rgba(0,0,0,.4)}
.fab.on{border-color:var(--gold);box-shadow:0 0 0 2px rgba(207,184,124,.35)}
.leaflet-top.leaflet-right{top:env(safe-area-inset-top)}
.leaflet-control-layers{border-radius:10px!important}
.leaflet-container{font:inherit}

.me{position:relative;width:22px;height:22px}
.me .core{position:absolute;inset:4px;border-radius:50%;background:var(--blue);border:2.5px solid #fff;
  box-shadow:0 0 8px rgba(59,157,255,.9)}
.me .pulse{position:absolute;inset:0;border-radius:50%;background:rgba(59,157,255,.55);
  animation:pulse 1.8s ease-out infinite}
.me.sim .core{background:#c08bff;box-shadow:0 0 8px rgba(192,139,255,.9)}
.me.sim .pulse{background:rgba(192,139,255,.55)}
@keyframes pulse{0%{transform:scale(.6);opacity:.9}100%{transform:scale(3.2);opacity:0}}

#toasts{position:absolute;left:50%;top:calc(50px + env(safe-area-inset-top));transform:translateX(-50%);
  z-index:1200;display:flex;flex-direction:column;gap:7px;align-items:center;pointer-events:none;width:92%}
.toast{background:rgba(21,24,33,.96);border:1px solid var(--gold);color:var(--text);padding:9px 15px;
  border-radius:12px;font-size:13.5px;font-weight:600;box-shadow:0 6px 20px rgba(0,0,0,.5);
  animation:tin .25s ease-out;max-width:100%;text-align:center}
.toast.out{opacity:0;transition:opacity .4s}
@keyframes tin{from{transform:translateY(-8px);opacity:0}}

#modal{position:fixed;inset:0;z-index:3000;background:rgba(0,0,0,.6);display:none;place-items:center;padding:20px}
#modal.show{display:grid}
#modal .box{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:20px;max-width:380px;width:100%}
#modal h2{margin:0 0 8px;font-size:18px}
#modal p{margin:0 0 10px;color:var(--muted);font-size:14px}
#modal .btn{display:block;width:100%;margin-top:8px;padding:13px;font-size:15px}
#modal .btn.pri{background:var(--gold);color:#14110a;border-color:var(--gold)}

/* ---------- mobile: bottom sheet ---------- */
@media (max-width:820px){
  #app{display:block}
  #mapwrap{position:fixed;left:0;right:0;top:0;bottom:var(--peek)}
  #panel{position:fixed;left:0;right:0;bottom:0;width:auto;height:72vh;height:72dvh;border-right:0;
    border-top:1px solid var(--line);border-radius:18px 18px 0 0;
    transform:translateY(calc(100% - var(--peek)));transition:transform .28s ease;
    box-shadow:0 -8px 30px rgba(0,0,0,.45)}
  #panel.open{transform:none}
  #handle{display:block;width:100%;padding:8px 0 4px}
  #handle::before{content:"";display:block;width:42px;height:5px;border-radius:5px;background:var(--line);margin:0 auto}
  .brand{display:none}
  .peek{padding:2px 12px 8px}
  .mini div{padding:5px 8px}
  .badges{grid-template-columns:1fr 1fr 1fr}
}
</style>
</head>
<body>
<div id="app">
  <aside id="panel">
    <button id="handle" aria-label="Expand panel"></button>
    <div class="brand">
      <div class="logo">R</div>
      <h1>Ralphie's Roam<small>CU Boulder campus explorer</small></h1>
    </div>
    <div class="peek">
      <button id="trackBtn"><span class="dot"></span><span id="trackLbl">Start Passive Tracking</span></button>
      <div class="mini">
        <div><b id="mMiles">0.00</b><span>miles</span></div>
        <div><b id="mPct">0%</b><span>uncovered</span></div>
        <div><b id="mXp">0</b><span>XP</span></div>
      </div>
    </div>
    <nav class="tabs">
      <button data-tab="zones" class="act">Zones</button>
      <button data-tab="badges">Badges</button>
      <button data-tab="stats">Live Stats</button>
    </nav>
    <div class="tabbody">
      <section id="tab-zones" class="act"></section>
      <section id="tab-badges"></section>
      <section id="tab-stats"></section>
    </div>
  </aside>
  <main id="mapwrap">
    <div id="map"></div>
    <div id="status"><i></i><span id="statusTxt">GPS off</span></div>
    <div id="toasts"></div>
    <div id="fabs">
      <button class="fab" id="fabSim" title="Simulated walking (tap map to walk)">🕹️</button>
      <button class="fab on" id="fabFog" title="Toggle fog of war">🌫️</button>
      <button class="fab on" id="fabFollow" title="Follow my location">🎯</button>
    </div>
  </main>
</div>
<div id="modal"><div class="box"><h2 id="mTitle"></h2><div id="mBody"></div><div id="mBtns"></div></div></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
(function(){
'use strict';

/* =====================================================================
   CONFIG
   ===================================================================== */
const CAMPUS = [40.0073, -105.2660], ZOOM = 16;
const CLAIM_M   = 15;   // snap-to-path threshold (meters)
const SEG_MAX_M = 20;   // paths are diced into claimable pieces this long
const REVEAL_M  = 34;   // fog hole radius per claimed piece (meters)
const ACC_MAX_M = 35;   // ignore GPS fixes with worse accuracy than this
const MAX_SPEED = 8;    // m/s — anything faster is a GPS jump (or a bus)
const LS_KEY = 'ralphies-roam-v1';

/* =====================================================================
   CAMPUS DATA — zones + walkways.
   Coordinates are hand-placed approximations. To field-correct them,
   drop a paths.geojson next to this file (LineStrings with properties
   {zone, name, tags:[...]}) and it replaces the built-in set.
   tags: "stairs" | "bridge" | "goat"
   ===================================================================== */
const ZONES = [
  {id:'norlin',      name:'Norlin Quad',          icon:'🏛️', color:'#CFB87C'},
  {id:'varsity',     name:'Varsity Lake & Old Main', icon:'🦆', color:'#7cc4cf'},
  {id:'farrand',     name:'Farrand Field',        icon:'🥏', color:'#8fd18a'},
  {id:'engineering', name:'Engineering Center',   icon:'⚙️', color:'#f0a35e'},
  {id:'kittredge',   name:'Kittredge Ponds',      icon:'🐟', color:'#b99cf2'},
  {id:'creek',       name:'Boulder Creek Path',   icon:'🌊', color:'#5eb1f0'}
];
let PATHS = [
  // --- Norlin Quad ---
  {id:'n-north', zone:'norlin', name:'Quad north walk', pts:[[40.00925,-105.27310],[40.00922,-105.27215],[40.00918,-105.27120]]},
  {id:'n-south', zone:'norlin', name:'Quad south walk', pts:[[40.00855,-105.27315],[40.00852,-105.27215],[40.00850,-105.27120]]},
  {id:'n-diag1', zone:'norlin', name:'Quad diagonal (NW–SE)', pts:[[40.00925,-105.27310],[40.00888,-105.27215],[40.00850,-105.27120]]},
  {id:'n-diag2', zone:'norlin', name:'Quad diagonal (SW–NE)', pts:[[40.00855,-105.27315],[40.00888,-105.27215],[40.00918,-105.27120]]},
  {id:'n-front', zone:'norlin', name:'Norlin Library front walk', pts:[[40.00918,-105.27120],[40.00884,-105.27112],[40.00850,-105.27120]]},
  {id:'n-steps', zone:'norlin', name:'Norlin Library steps', tags:['stairs'], pts:[[40.00884,-105.27112],[40.00882,-105.27088]]},
  {id:'n-goat',  zone:'norlin', name:'Quad desire line', tags:['goat'], pts:[[40.00922,-105.27215],[40.00905,-105.27165],[40.00884,-105.27112]]},
  {id:'n-umc',   zone:'norlin', name:'Walk to the UMC', pts:[[40.00850,-105.27120],[40.00790,-105.27130],[40.00720,-105.27140]]},
  // --- Varsity Lake & Old Main ---
  {id:'v-oldmain', zone:'varsity', name:'Old Main walk', pts:[[40.00925,-105.27310],[40.00965,-105.27300],[40.01000,-105.27290]]},
  {id:'v-macky',   zone:'varsity', name:'Macky to the lake', pts:[[40.01000,-105.27290],[40.00990,-105.27240]]},
  {id:'v-loop',    zone:'varsity', name:'Varsity Lake loop', pts:[[40.00990,-105.27240],[40.01000,-105.27195],[40.00988,-105.27150],[40.00962,-105.27150],[40.00952,-105.27195],[40.00962,-105.27240],[40.00990,-105.27240]]},
  {id:'v-bridge',  zone:'varsity', name:'Varsity Bridge', tags:['bridge'], pts:[[40.01000,-105.27195],[40.00952,-105.27195]]},
  {id:'v-link',    zone:'varsity', name:'Lake to the Quad', pts:[[40.00952,-105.27195],[40.00922,-105.27215]]},
  {id:'v-steps',   zone:'varsity', name:'Macky steps', tags:['stairs'], pts:[[40.01000,-105.27290],[40.01022,-105.27300]]},
  // --- Farrand Field ---
  {id:'f-loop',  zone:'farrand', name:'Farrand Field perimeter', pts:[[40.00645,-105.26815],[40.00645,-105.26665],[40.00555,-105.26665],[40.00555,-105.26815],[40.00645,-105.26815]]},
  {id:'f-goat',  zone:'farrand', name:'Field diagonal', tags:['goat'], pts:[[40.00645,-105.26815],[40.00600,-105.26740],[40.00555,-105.26665]]},
  {id:'f-steps', zone:'farrand', name:'Farrand terrace steps', tags:['stairs'], pts:[[40.00555,-105.26740],[40.00530,-105.26740]]},
  {id:'f-east',  zone:'farrand', name:'Walk toward Engineering', pts:[[40.00645,-105.26665],[40.00690,-105.26640],[40.00720,-105.26600]]},
  {id:'f-west',  zone:'farrand', name:'Walk toward the UMC', pts:[[40.00645,-105.26815],[40.00660,-105.26900],[40.00670,-105.26990]]},
  // --- Engineering Center ---
  {id:'e-plaza', zone:'engineering', name:'Engineering plaza approach', pts:[[40.00720,-105.26600],[40.00720,-105.26500],[40.00720,-105.26400]]},
  {id:'e-ew',    zone:'engineering', name:'East–west breezeway', pts:[[40.00720,-105.26400],[40.00722,-105.26340],[40.00724,-105.26280],[40.00726,-105.26220]]},
  {id:'e-ns',    zone:'engineering', name:'North–south breezeway', pts:[[40.00770,-105.26310],[40.00722,-105.26310],[40.00675,-105.26312]]},
  {id:'e-bridge',zone:'engineering', name:'Regent Drive footbridge', tags:['bridge'], pts:[[40.00675,-105.26312],[40.00640,-105.26330],[40.00605,-105.26350]]},
  {id:'e-steps', zone:'engineering', name:'ITLL steps', tags:['stairs'], pts:[[40.00724,-105.26280],[40.00745,-105.26265]]},
  {id:'e-goat',  zone:'engineering', name:'North lot cut-through', tags:['goat'], pts:[[40.00770,-105.26310],[40.00800,-105.26350],[40.00830,-105.26400]]},
  // --- Kittredge Ponds ---
  {id:'k-loop',  zone:'kittredge', name:'Kittredge pond loop', pts:[[40.00335,-105.26280],[40.00340,-105.26225],[40.00320,-105.26175],[40.00280,-105.26170],[40.00262,-105.26225],[40.00280,-105.26285],[40.00335,-105.26280]]},
  {id:'k-bridge',zone:'kittredge', name:'Pond footbridge', tags:['bridge'], pts:[[40.00340,-105.26225],[40.00300,-105.26228],[40.00262,-105.26225]]},
  {id:'k-c4c',   zone:'kittredge', name:'Ponds to the C4C', pts:[[40.00335,-105.26280],[40.00390,-105.26380],[40.00440,-105.26450]]},
  {id:'k-biz',   zone:'kittredge', name:'C4C to Regent Drive', pts:[[40.00440,-105.26450],[40.00520,-105.26400],[40.00605,-105.26350]]},
  {id:'k-steps', zone:'kittredge', name:'Fiske hill steps', tags:['stairs'], pts:[[40.00390,-105.26380],[40.00365,-105.26350]]},
  {id:'k-goat',  zone:'kittredge', name:'Sledding hill shortcut', tags:['goat'], pts:[[40.00262,-105.26225],[40.00235,-105.26300],[40.00220,-105.26380]]},
  // --- Boulder Creek Path ---
  {id:'c-main',  zone:'creek', name:'Boulder Creek Path', pts:[[40.01290,-105.27600],[40.01270,-105.27480],[40.01245,-105.27360],[40.01225,-105.27240],[40.01205,-105.27120],[40.01190,-105.27000],[40.01175,-105.26880],[40.01160,-105.26760],[40.01145,-105.26640],[40.01135,-105.26520]]},
  {id:'c-br17',  zone:'creek', name:'17th Street footbridge', tags:['bridge'], pts:[[40.01245,-105.27360],[40.01275,-105.27355]]},
  {id:'c-brfol', zone:'creek', name:'Folsom footbridge', tags:['bridge'], pts:[[40.01175,-105.26880],[40.01205,-105.26875]]},
  {id:'c-steps', zone:'creek', name:'Hill stairs down to the creek', tags:['stairs'], pts:[[40.01060,-105.27010],[40.01125,-105.27005],[40.01190,-105.27000]]},
  {id:'c-goat',  zone:'creek', name:'Creekside dirt spur', tags:['goat'], pts:[[40.01160,-105.26760],[40.01128,-105.26705],[40.01145,-105.26640]]}
];

/* =====================================================================
   GEOMETRY (flat-earth meters around campus — plenty accurate at 2 km)
   ===================================================================== */
const KX = Math.cos(CAMPUS[0]*Math.PI/180)*111320, KY = 110574;
const toXY = (lat,lng)=>[(lng-CAMPUS[1])*KX,(lat-CAMPUS[0])*KY];
function distM(a,b){const p=toXY(a[0],a[1]),q=toXY(b[0],b[1]);return Math.hypot(p[0]-q[0],p[1]-q[1]);}
function distToSeg(p,s){
  const dx=s.bx-s.ax, dy=s.by-s.ay, l2=dx*dx+dy*dy;
  let t=l2?((p[0]-s.ax)*dx+(p[1]-s.ay)*dy)/l2:0; t=t<0?0:t>1?1:t;
  return Math.hypot(p[0]-(s.ax+t*dx), p[1]-(s.ay+t*dy));
}
let SEGS=[], SEG_BY_ID={}, TOTAL_LEN=0;
function buildSegments(){
  SEGS=[]; SEG_BY_ID={}; TOTAL_LEN=0;
  PATHS.forEach(p=>{
    for(let i=0;i<p.pts.length-1;i++){
      const A=p.pts[i], B=p.pts[i+1], d=distM(A,B), n=Math.max(1,Math.ceil(d/SEG_MAX_M));
      for(let j=0;j<n;j++){
        const a=[A[0]+(B[0]-A[0])*j/n, A[1]+(B[1]-A[1])*j/n];
        const b=[A[0]+(B[0]-A[0])*(j+1)/n, A[1]+(B[1]-A[1])*(j+1)/n];
        const axy=toXY(a[0],a[1]), bxy=toXY(b[0],b[1]);
        const s={id:p.id+'.'+i+'.'+j, zone:p.zone, name:p.name, tags:p.tags||[], a, b,
                 mid:[(a[0]+b[0])/2,(a[1]+b[1])/2], ax:axy[0], ay:axy[1], bx:bxy[0], by:bxy[1], len:d/n};
        SEGS.push(s); SEG_BY_ID[s.id]=s; TOTAL_LEN+=s.len;
      }
    }
  });
}

/* =====================================================================
   STATE + PERSISTENCE (localStorage = fast snapshot, IndexedDB = mirror + GPS track log)
   ===================================================================== */
const DEFAULTS = {claimed:{}, meters:0, badges:{}, layer:'Street', fogOn:true, started:Date.now()};
let S = Object.assign({}, DEFAULTS);
function loadLS(){
  try{ const raw=localStorage.getItem(LS_KEY); if(raw){ S=Object.assign({},DEFAULTS,JSON.parse(raw)); return true; } }catch(e){}
  return false;
}
let db=null;
const dbReady = new Promise(res=>{
  try{
    const rq=indexedDB.open('ralphies-roam',1);
    rq.onupgradeneeded=()=>{ const d=rq.result;
      if(!d.objectStoreNames.contains('kv')) d.createObjectStore('kv');
      if(!d.objectStoreNames.contains('track')) d.createObjectStore('track',{autoIncrement:true}); };
    rq.onsuccess=()=>{ db=rq.result; res(db); };
    rq.onerror=()=>res(null); rq.onblocked=()=>res(null);
  }catch(e){ res(null); }
});
function idb(store,mode,fn){
  return dbReady.then(d=>new Promise(res=>{
    if(!d) return res(null);
    try{ const tx=d.transaction(store,mode); const r=fn(tx.objectStore(store));
      tx.oncomplete=()=>res(r&&r.result); tx.onerror=tx.onabort=()=>res(null);
    }catch(e){ res(null); }
  }));
}
function saveNow(){
  try{ localStorage.setItem(LS_KEY, JSON.stringify(S)); }catch(e){}
  idb('kv','readwrite',st=>st.put(S,'state'));
}
let saveT=0;
function saveSoon(){ clearTimeout(saveT); saveT=setTimeout(saveNow,600); }
function logTrack(lat,lng,acc,src){ idb('track','readwrite',st=>st.add({t:Date.now(),lat,lng,acc:Math.round(acc),src})); }

/* =====================================================================
   DERIVED PROGRESS
   ===================================================================== */
function progress(){
  const z={}; ZONES.forEach(o=>z[o.id]={len:0,got:0,n:0,gotN:0});
  const tag={stairs:[0,0],bridge:[0,0],goat:[0,0]};
  let got=0, gotN=0, tagged=0;
  SEGS.forEach(s=>{
    const c=!!S.claimed[s.id], zz=z[s.zone]||(z[s.zone]={len:0,got:0,n:0,gotN:0});
    zz.len+=s.len; zz.n++; if(c){zz.got+=s.len; zz.gotN++; got+=s.len; gotN++;}
    s.tags.forEach(t=>{ if(tag[t]){ tag[t][1]++; if(c){tag[t][0]++; tagged++;} } });
  });
  const miles=S.meters/1609.344, nb=Object.keys(S.badges).length;
  const xp = gotN*10 + tagged*15 + nb*100 + Math.floor(S.meters/100)*5;
  const level = Math.floor(Math.sqrt(xp/150))+1;
  const cur=150*(level-1)*(level-1), next=150*level*level;
  return {z, tag, got, gotN, pct: TOTAL_LEN? got/TOTAL_LEN*100 : 0, miles, xp, level,
          lvlPct:(xp-cur)/(next-cur)*100, toNext:next-xp, nb};
}

/* ---- fog of war canvas ---- */
const fog = L.DomUtil.create('canvas','', map.getPane('fog'));
fog.style.position='absolute';
let pos=null, fogQueued=false;
function drawFog(){
  fogQueued=false;
  const size=map.getSize(), dpr=Math.min(window.devicePixelRatio||1,2);
  if(fog.width!==Math.round(size.x*dpr)||fog.height!==Math.round(size.y*dpr)){
    fog.width=Math.round(size.x*dpr); fog.height=Math.round(size.y*dpr);
    fog.style.width=size.x+'px'; fog.style.height=size.y+'px';
  }
  L.DomUtil.setPosition(fog, map.containerPointToLayerPoint([0,0]));
  const ctx=fog.getContext('2d');
  ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.globalCompositeOperation='source-over';
  ctx.clearRect(0,0,size.x,size.y);
  if(!S.fogOn) return;
  ctx.fillStyle='rgba(10,12,18,0.86)';
  ctx.fillRect(0,0,size.x,size.y);
  ctx.globalCompositeOperation='destination-out';
  const mpp=156543.03392*Math.cos(map.getCenter().lat*Math.PI/180)/Math.pow(2,map.getZoom());
  const r=Math.max(9, REVEAL_M/mpp);
  const hole=(ll,rr)=>{
    const p=map.latLngToContainerPoint(ll);
    if(p.x<-rr||p.y<-rr||p.x>size.x+rr||p.y>size.y+rr) return;
    const g=ctx.createRadialGradient(p.x,p.y,rr*0.3,p.x,p.y,rr);
    g.addColorStop(0,'rgba(0,0,0,1)'); g.addColorStop(1,'rgba(0,0,0,0)');
    ctx.fillStyle=g; ctx.beginPath(); ctx.arc(p.x,p.y,rr,0,Math.PI*2); ctx.fill();
  };
  for(let i=0;i<SEGS.length;i++){ const s=SEGS[i]; if(S.claimed[s.id]){ hole(s.a,r); hole(s.mid,r); } }
  if(pos) hole([pos.lat,pos.lng], r*0.75);
}
function queueFog(){ if(!fogQueued){ fogQueued=true; requestAnimationFrame(drawFog); } }
map.on('move zoom zoomend moveend resize viewreset', queueFog);
drawFog();

/* ---- user marker ---- */
let meMarker=null, accCircle=null, follow=true;
function showMe(lat,lng,acc,simMode){
  const ll=[lat,lng];
  if(!meMarker){
    meMarker=L.marker(ll,{icon:L.divIcon({className:'',html:'<div class="me"><div class="pulse"></div><div class="core"></div></div>',iconSize:[22,22],iconAnchor:[11,11]}),interactive:false,zIndexOffset:1000}).addTo(map);
    accCircle=L.circle(ll,{radius:acc,color:'#3b9dff',weight:1,opacity:.5,fillOpacity:.08,interactive:false}).addTo(map);
  }
  meMarker.setLatLng(ll); accCircle.setLatLng(ll).setRadius(Math.min(acc,300));
  const el=meMarker.getElement(); if(el) el.firstChild.classList.toggle('sim',!!simMode);
  if(follow) map.panTo(ll,{animate:true,duration:.5});
}
map.on('dragstart',()=>{ follow=false; $('fabFollow').classList.remove('on'); });

/* =====================================================================
   POSITION PIPELINE — every fix (real GPS or simulated) flows through onFix
   ===================================================================== */
let last=null; // last accepted fix {ll,t}
function claimAlong(points){
  const fresh=[];
  for(const pt of points){
    const xy=toXY(pt[0],pt[1]);
    for(let i=0;i<SEGS.length;i++){
      const s=SEGS[i];
      if(!S.claimed[s.id] && distToSeg(xy,s)<=CLAIM_M){ S.claimed[s.id]=Date.now(); fresh.push(s); }
    }
  }
  return fresh;
}
function onFix(lat,lng,acc,src){
  pos={lat,lng,acc};
  showMe(lat,lng,acc,src==='sim');
  const good = src==='sim' || acc<=ACC_MAX_M;
  if(src==='gps') setStatus(good?'ok':'warn', good?('Tracking · ±'+Math.round(acc)+' m'):('Weak GPS · ±'+Math.round(acc)+' m — waiting'));
  if(good){
    const now=Date.now(), here=[lat,lng]; let pts=[here], moved=false;
    if(!last){ last={ll:here,t:now}; logTrack(lat,lng,acc,src); }
    else{
      const d=distM(last.ll,here), dt=(now-last.t)/1000;
      if(d>=Math.max(4,acc*0.5)){
        const plausible = src==='sim' || (dt<=90 && d/Math.max(dt,0.5)<=MAX_SPEED);
        if(plausible){
          S.meters+=d; moved=true;
          const n=Math.min(40,Math.floor(d/6)); // fill the gap between fixes so nothing is skipped
          for(let k=1;k<n;k++) pts.push([last.ll[0]+(lat-last.ll[0])*k/n, last.ll[1]+(lng-last.ll[1])*k/n]);
        }
        last={ll:here,t:now}; logTrack(lat,lng,acc,src);
      }
    }
    const fresh=claimAlong(pts);
    if(fresh.length){
      fresh.forEach(s=>segLines[s.id]&&segLines[s.id].setStyle(ST_DONE));
      const special=fresh.find(s=>s.tags.length);
      toast('+'+fresh.length+' segment'+(fresh.length>1?'s':'')+' · '+(special||fresh[0]).name);
      buzz(30);
    }
    if(fresh.length||moved){ checkBadges(fresh.length>0); saveSoon(); render(); }
  }
  queueFog();
}

/* =====================================================================
   REAL GPS — navigator.geolocation.watchPosition
   ===================================================================== */
let watchId=null, wakeLock=null;
const GEO_OPTS={enableHighAccuracy:true, maximumAge:1000, timeout:10000};
function startGPS(){
  if(sim.on) setSim(false);
  if(!('geolocation' in navigator)) return gpsProblem('This browser has no location support.','You can still explore with simulated walking.');
  if(!window.isSecureContext) return gpsProblem('GPS needs a secure (https) page.','Open this app from its https:// address, or use simulated walking for now.');
  setStatus('warn','Finding GPS…');
  watchId=navigator.geolocation.watchPosition(
    p=>onFix(p.coords.latitude,p.coords.longitude,p.coords.accuracy||999,'gps'),
    err=>{
      if(err.code===1){ stopGPS(); gpsProblem('Location permission was denied.','To use real GPS, allow location for this site (iPhone: Settings → Privacy & Security → Location Services → Safari Websites → While Using; then reload). Or keep going in simulated mode.'); }
      else if(err.code===2) setStatus('bad','GPS unavailable — still trying');
      else setStatus('warn','GPS timeout — still trying');
    }, GEO_OPTS);
  follow=true; $('fabFollow').classList.add('on');
  lockScreen(); setTrackUI(true);
}
function stopGPS(){
  if(watchId!==null){ navigator.geolocation.clearWatch(watchId); watchId=null; }
  if(wakeLock){ try{wakeLock.release();}catch(e){} wakeLock=null; }
  last=null; setTrackUI(false); if(!sim.on) setStatus('', 'GPS off'); saveNow();
}
function lockScreen(){ // keep the screen awake so the browser keeps delivering GPS fixes
  if('wakeLock' in navigator) navigator.wakeLock.request('screen').then(w=>{wakeLock=w;}).catch(()=>{});
}
document.addEventListener('visibilitychange',()=>{
  if(document.visibilityState==='hidden') saveNow();
  else if(watchId!==null){ last=null; lockScreen(); }
});
window.addEventListener('pagehide',saveNow);
function gpsProblem(title,body){
  setStatus('bad','GPS off');
  modal(title,'<p>'+body+'</p>',[
    ['Use simulated walking','pri',()=>setSim(true)],
    ['Try GPS again','',()=>startGPS()],
    ['Close','',()=>{}]]);
}
function setTrackUI(on){
  $('trackBtn').classList.toggle('on',on);
  $('trackLbl').textContent=on?'Tracking — tap to stop':'Start Passive Tracking';
}

/* =====================================================================
   SIMULATED MODE — tap the map and the marker walks there
   ===================================================================== */
const sim={on:false,pos:null,target:null,timer:0};
function setSim(on){
  sim.on=on; $('fabSim').classList.toggle('on',on);
  clearInterval(sim.timer); sim.timer=0; sim.target=null;
  if(on){
    if(watchId!==null) stopGPS();
    last=null;
    const c=pos?[pos.lat,pos.lng]:[map.getCenter().lat,map.getCenter().lng];
    sim.pos=c; setStatus('sim','Simulated · tap the map to walk');
    onFix(c[0],c[1],5,'sim');
  }else{ last=null; if(watchId===null) setStatus('','GPS off'); }
}
map.on('click',e=>{
  if(!sim.on) return;
  sim.target=[e.latlng.lat,e.latlng.lng];
  if(!sim.timer) sim.timer=setInterval(simStep,110);
});
function simStep(){
  if(!sim.target){ clearInterval(sim.timer); sim.timer=0; return; }
  const d=distM(sim.pos,sim.target), step=7;
  if(d<=step){ sim.pos=sim.target; sim.target=null; }
  else sim.pos=[sim.pos[0]+(sim.target[0]-sim.pos[0])*step/d, sim.pos[1]+(sim.target[1]-sim.pos[1])*step/d];
  onFix(sim.pos[0],sim.pos[1],5,'sim');
}

  idb('kv','readonly',st=>st.get('state')).then(v=>{ if(v&&v.claimed){ S=Object.assign({},DEFAULTS,v); refreshAll(); } });
}
if(location.protocol.indexOf('http')===0){
  fetch('paths.geojson',{cache:'no-cache'}).then(r=>r.ok?r.json():null).then(g=>{
    if(!g||!g.features) return;
    const custom=g.features.filter(f=>f.geometry&&f.geometry.type==='LineString').map((f,i)=>({
      id:(f.properties&&f.properties.id)||('x'+i), zone:(f.properties&&f.properties.zone)||ZONES[0].id,
      name:(f.properties&&f.properties.name)||'Path '+(i+1), tags:(f.properties&&f.properties.tags)||[],
      pts:f.geometry.coordinates.map(c=>[c[1],c[0]])}));
    if(custom.length){ PATHS=custom; refreshAll(); }
  }).catch(()=>{});
  if('serviceWorker' in navigator) window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
}

// small hook for testing from the console
window.RR={onFix, state:()=>S, progress, segs:()=>SEGS, setSim};
})();
</script>
</body>
</html>
