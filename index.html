/* =====================================================================
   CONFIG

const CAMPUS = [40.0073, -105.2660], ZOOM = 16;
const CLAIM_M   = 15;   // snap-to-path threshold (meters)
const SEG_MAX_M = 20;   // paths are diced into claimable pieces this long

const FOG_ALPHA = 0.35; // fog darkness, 0 (none) to 1 (solid)

const LS_KEY = 'ralphies-roam-v1';   // storage keys keep the original name so nobody loses progress
const STREAK_SEGS = 10;  // a day counts toward a streak with 1 new claim OR this many distinct segments walked
const TZ = 'America/Denver';
function dkey(){
  const d=new Date();
  try{ return d.toLocaleDateString('en-CA',{timeZone:TZ}); }
  catch(e){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
}
function addDays(k,n){ const a=k.split('-').map(Number); return new Date(Date.UTC(a[0],a[1]-1,a[2]+n)).toISOString().slice(0,10); }
function weekKey(k){ k=k||dkey(); const a=k.split('-').map(Number); return addDays(k,-((new Date(Date.UTC(a[0],a[1]-1,a[2])).getUTCDay()+6)%7)); }

  // --- Kittredge Ponds ---
  {id:'k-loop',  zone:'kittredge', name:'Kittredge pond loop', pts:[[40.00335,-105.26280],[40.00340,-105.26225],[40.00320,-105.26175],[40.00280,-105.26170],[40.00262,-105.26225],[40.00280,-105.26285],[40.00335,-105.26280]]},

  {id:'k-biz',   zone:'kittredge', name:'C4C to Regent Drive', pts:[[40.00440,-105.26450],[40.00520,-105.26400],[40.00605,-105.26350]]},

  // --- Boulder Creek Path ---
  {id:'c-main',  zone:'creek', name:'Boulder Creek Path', pts:[[40.01290,-105.27600],[40.01270,-105.27480],[40.01245,-105.27360],[40.01225,-105.27240],[40.01205,-105.27120],[40.01190,-105.27000],[40.01175,-105.26880],[40.01160,-105.26760],[40.01145,-105.26640],[40.01135,-105.26520]]},
  {id:'c-br17',  zone:'creek', name:'17th Street footbridge', tags:['bridge'], pts:[[40.01245,-105.27360],[40.01275,-105.27355]]},
  {id:'c-brfol', zone:'creek', name:'Folsom footbridge', tags:['bridge'], pts:[[40.01175,-105.26880],[40.01205,-105.26875]]},
  {id:'c-steps', zone:'creek', name:'Hill stairs down to the creek', tags:['stairs'], pts:[[40.01060,-105.27010],[40.01125,-105.27005],[40.01190,-105.27000]]},
  {id:'c-goat',  zone:'creek', name:'Creekside dirt spur', tags:['goat'], pts:[[40.01160,-105.26760],[40.01128,-105.26705],[40.01145,-105.26640]]}
];

/* =====================================================================
   GEOMETRY (flat-earth meters around campus — plenty accurate at 2 km)
   ===================================================================== */
const KX = Math.cos(CAMPUS[0]*Math.PI/180)*111320, KY = 110574;
const toXY = (lat,lng)=>[(lng-CAMPUS[1])*KX,(lat-CAMPUS[0])*KY];
function distM(a,b){const p=toXY(a[0],a[1]),q=toXY(b[0],b[1]);return Math.hypot(p[0]-q[0],p[1]-q[1]);}
function distToSeg(p,s){
  const dx=s.bx-s.ax, dy=s.by-s.ay, l2=dx*dx+dy*dy;
  let t=l2?((p[0]-s.ax)*dx+(p[1]-s.ay)*dy)/l2:0; t=t<0?0:t>1?1:t;
  return Math.hypot(p[0]-(s.ax+t*dx), p[1]-(s.ay+t*dy));
}
let SEGS=[], SEG_BY_ID={}, TOTAL_LEN=0;
let PATH_BY_ID={};
let SEG_META={}, PATH_SEGN={}, PATH_SEGS={}, PATH_LEN={};   // path indexes for goals (filled by indexPaths)
let GRAPH=null, EDGE_SEGS=null, PLAN_CACHE={}, DAYM={};               // walkway routing for the class commute (rebuilt with the paths)
function buildSegments(){
  SEGS=[]; SEG_BY_ID={}; TOTAL_LEN=0; PATH_BY_ID={};
  PATHS.forEach(p=>{
    PATH_BY_ID[p.id]=p;
    for(let i=0;i<p.pts.length-1;i++){
      const A=p.pts[i], B=p.pts[i+1], d=distM(A,B), n=Math.max(1,Math.ceil(d/SEG_MAX_M));
      for(let j=0;j<n;j++){
        const a=[A[0]+(B[0]-A[0])*j/n, A[1]+(B[1]-A[1])*j/n];
        const b=[A[0]+(B[0]-A[0])*(j+1)/n, A[1]+(B[1]-A[1])*(j+1)/n];
        const axy=toXY(a[0],a[1]), bxy=toXY(b[0],b[1]);
        const s={id:p.id+'.'+i+'.'+j, pid:p.id, zone:p.zone, name:p.name, tags:p.tags||[], a, b,
                 mid:[(a[0]+b[0])/2,(a[1]+b[1])/2], ax:axy[0], ay:axy[1], bx:bxy[0], by:bxy[1], len:d/n,
                 cx:(axy[0]+bxy[0])/2, cy:(axy[1]+bxy[1])/2, rr:d/n/2+CLAIM_M};
        SEGS.push(s); SEG_BY_ID[s.id]=s; TOTAL_LEN+=s.len;
      }
    }
  });
  indexPaths(); GRAPH=null; EDGE_SEGS=null; PLAN_CACHE={}; DAYM={};
}

/* =====================================================================
   STATE + PERSISTENCE (localStorage = fast snapshot, IndexedDB = mirror + GPS track log)
   ===================================================================== */
function DEF(){ return {claimed:{}, meters:0, badges:{}, fogOn:false, started:Date.now(),
  pending:{claims:{},badges:{},week:false,streak:false},
  streak:{count:0,best:0,last:null,freezes:0}, week:{id:null,visits:{}}, day:{id:null,seen:{},newSegs:0},
  quest:null, scenic:{done:[],knowWay:null}}; }
function normalize(){
  const d=DEF();
  ['claimed','badges'].forEach(k=>{ if(!S[k]) S[k]={}; });
  if(!S.pending||!S.pending.claims) S.pending=d.pending;
  if(!S.pending.badges) S.pending.badges={};
  if(!S.streak) S.streak=d.streak;
  if(!S.week||!S.week.visits) S.week=d.week;
  if(!S.day||!S.day.seen) S.day=d.day;
  if(!S.scenic||!Array.isArray(S.scenic.done)) S.scenic=d.scenic;
  rollDates();
}
function rollDates(){
  const t=dkey(), w=weekKey(t);
  if(S.week.id!==w){ S.week={id:w,visits:{}}; S.pending.week=false; }
  if(S.day.id!==t) S.day={id:t,seen:{},newSegs:0};
}
let S = DEF();
function loadLS(){
  try{ const raw=localStorage.getItem(LS_KEY); if(raw){ S=Object.assign(DEF(),JSON.parse(raw)); return true; } }catch(e){}
  return false;
}
let db=null;
const dbReady = new Promise(res=>{
  try{
    const rq=indexedDB.open('ralphies-roam',1);
    rq.onupgradeneeded=()=>{ const d=rq.result;
      if(!d.objectStoreNames.contains('kv')) d.createObjectStore('kv');
      if(!d.objectStoreNames.contains('track')) d.createObjectStore('track',{autoIncrement:true}); };
    rq.onsuccess=()=>{ db=rq.result; res(db); };
    rq.onerror=()=>res(null); rq.onblocked=()=>res(null);
  }catch(e){ res(null); }
});
function idb(store,mode,fn){
  return dbReady.then(d=>new Promise(res=>{
    if(!d) return res(null);
    try{ const tx=d.transaction(store,mode); const r=fn(tx.objectStore(store));
      tx.oncomplete=()=>res(r&&r.result); tx.onerror=tx.onabort=()=>res(null);
    }catch(e){ res(null); }
  }));
}
function saveNow(){
  try{ localStorage.setItem(LS_KEY, JSON.stringify(S)); }catch(e){}
  idb('kv','readwrite',st=>st.put(S,'state'));
}
let saveT=0;
function saveSoon(){ clearTimeout(saveT); saveT=setTimeout(saveNow,600); }
function logTrack(lat,lng,acc,src){ idb('track','readwrite',st=>st.add({t:Date.now(),lat,lng,acc:Math.round(acc),src})); }

/* =====================================================================
   DERIVED PROGRESS
   ===================================================================== */
function progress(){
  const z={}; ZONES.forEach(o=>z[o.id]={len:0,got:0,n:0,gotN:0});
  const tag={stairs:[0,0],bridge:[0,0],goat:[0,0]};
  let got=0, gotN=0, tagged=0;
  SEGS.forEach(s=>{
    const c=!!S.claimed[s.id], zz=z[s.zone]||(z[s.zone]={len:0,got:0,n:0,gotN:0});
    zz.len+=s.len; zz.n++; if(c){zz.got+=s.len; zz.gotN++; got+=s.len; gotN++;}
    s.tags.forEach(t=>{ if(tag[t]){ tag[t][1]++; if(c){tag[t][0]++; tagged++;} } });
  });
  const miles=S.meters/1609.344, nb=Object.keys(S.badges).length;
  const xp = gotN*10 + tagged*15 + nb*100 + Math.floor(S.meters/100)*5;
  const level = Math.floor(Math.sqrt(xp/150))+1;
  const cur=150*(level-1)*(level-1), next=150*level*level;
  return {z, tag, got, gotN, pct: TOTAL_LEN? got/TOTAL_LEN*100 : 0, miles, xp, level,
          lvlPct:(xp-cur)/(next-cur)*100, toNext:next-xp, nb, streak:streakNow(), best:S.streak.best,
          weekSegs:Object.keys(S.week.visits).length};
}

/* =====================================================================
   BADGES
   ===================================================================== */
const BADGES = [
  {id:'first',   ic:'👣', name:'First Steps',       how:'Claim your first path segment', test:p=>p.gotN>=1},

const fog = L.DomUtil.create('canvas','', map.getPane('fog'));

let pos=null, fogQueued=false;
function drawFog(){
  fogQueued=false;
  const size=map.getSize(), dpr=Math.min(window.devicePixelRatio||1,2);
  if(fog.width!==Math.round(size.x*dpr)||fog.height!==Math.round(size.y*dpr)){
    fog.width=Math.round(size.x*dpr); fog.height=Math.round(size.y*dpr);
    fog.style.width=size.x+'px'; fog.style.height=size.y+'px';
  }
  L.DomUtil.setPosition(fog, map.containerPointToLayerPoint([0,0]));
  const ctx=fog.getContext('2d');
  ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.globalCompositeOperation='source-over';
  ctx.clearRect(0,0,size.x,size.y);
  if(!S.fogOn) return;
  ctx.fillStyle='rgba(0,0,0,'+FOG_ALPHA+')';
  ctx.fillRect(0,0,size.x,size.y);
  ctx.globalCompositeOperation='destination-out';
  const mpp=156543.03392*Math.cos(map.getCenter().lat*Math.PI/180)/Math.pow(2,map.getZoom());
  const r=Math.max(9, REVEAL_M/mpp);
  const hole=(ll,rr)=>{
    const p=map.latLngToContainerPoint(ll);
    if(p.x<-rr||p.y<-rr||p.x>size.x+rr||p.y>size.y+rr) return;
    const g=ctx.createRadialGradient(p.x,p.y,rr*0.3,p.x,p.y,rr);
    g.addColorStop(0,'rgba(0,0,0,1)'); g.addColorStop(1,'rgba(0,0,0,0)');
    ctx.fillStyle=g; ctx.beginPath(); ctx.arc(p.x,p.y,rr,0,Math.PI*2); ctx.fill();
  };
  for(let i=0;i<SEGS.length;i++){ const s=SEGS[i]; if(S.claimed[s.id]){ hole(s.a,r); hole(s.mid,r); } }
  if(pos) hole([pos.lat,pos.lng], r*1.6);
}
function queueFog(){ if(!fogQueued){ fogQueued=true; requestAnimationFrame(drawFog); } }

/* =====================================================================
   POSITION PIPELINE — every GPS fix flows through onFix
   ===================================================================== */
let last=null; // last accepted fix {ll,t}
function claimAlong(points){
  const fresh=[]; let visited=0;
  for(const pt of points){
    const xy=toXY(pt[0],pt[1]);
    for(let i=0;i<SEGS.length;i++){
      const s=SEGS[i];
      if(Math.abs(xy[0]-s.cx)>s.rr||Math.abs(xy[1]-s.cy)>s.rr) continue;
      if(distToSeg(xy,s)>CLAIM_M) continue;
      if(!S.week.visits[s.id]){ S.week.visits[s.id]=1; S.pending.week=true; visited++; }
      if(!S.day.seen[s.id]){ S.day.seen[s.id]=1; visited++; }
      if(!S.claimed[s.id]){ S.claimed[s.id]=Date.now(); S.pending.claims[s.id]=S.claimed[s.id]; S.day.newSegs++; fresh.push(s); }
    }
  }
  return {fresh, visited};
}
function dayQualifies(){ return S.day.newSegs>0 || Object.keys(S.day.seen).length>=STREAK_SEGS; }
function streakNow(){
  const st=S.streak, t=dkey(); if(!st.last) return 0;
  if(st.last===t||st.last===addDays(t,-1)) return st.count;
  if(st.last===addDays(t,-2)&&st.freezes>0) return st.count;
  return 0;
}
function updateStreak(){
  const t=S.day.id, st=S.streak;
  if(st.last===t || !dayQualifies()) return false;
  if(st.last===addDays(t,-1)) st.count++;
  else if(st.last===addDays(t,-2) && st.freezes>0){ st.freezes--; st.count++; toast('🧊 Streak freeze used — your streak survives'); }
  else st.count=1;
  st.last=t; if(st.count>st.best) st.best=st.count;
  toast('🔥 '+(st.count===1?'Streak started — come back tomorrow for day 2':st.count+'-day streak!')); buzz([40,30,40]);
  if(st.count%7===0 && st.freezes<2){ st.freezes++; setTimeout(()=>toast('🧊 Earned a streak freeze (covers one missed day)'),900); }
  S.pending.streak=true;
  return true;
}
const zoneRemToast={};
function nearMissToasts(fresh){
  const zs={}; fresh.forEach(s=>zs[s.zone]=1);
  const p=progress();
  Object.keys(zs).forEach(z=>{
    const zz=p.z[z]; if(!zz) return; const rem=zz.n-zz.gotN, zn=(ZONES.find(x=>x.id===z)||{}).name||z;
    if(rem>0 && rem<=3 && zoneRemToast[z]!==rem){ zoneRemToast[z]=rem; setTimeout(()=>toast('🏁 '+rem+' segment'+(rem>1?'s':'')+' left to complete '+zn+'!'),700); buzz([20,40,20]); }
  });
}
function onFix(lat,lng,acc,src){
  pos={lat,lng,acc};
  showMe(lat,lng,acc);
  const good = acc<=ACC_MAX_M;
  if(src==='gps') setStatus(good?'ok':'warn', good?('Tracking · ±'+Math.round(acc)+' m'):('Weak GPS · ±'+Math.round(acc)+' m — waiting'));
  if(good){
    rollDates();
    const now=Date.now(), here=[lat,lng]; let pts=[here], moved=false;
    if(!last){ last={ll:here,t:now}; logTrack(lat,lng,acc,src); recPoint(lat,lng); }
    else{
      const d=distM(last.ll,here), dt=(now-last.t)/1000;
      if(d>=Math.max(4,acc*0.5)){
        const plausible = dt<=90 && d/Math.max(dt,0.5)<=MAX_SPEED;
        if(plausible){
          S.meters+=d; if(S.rec){ S.rec.meters+=d; if(d/Math.max(dt,0.5)>=0.3) S.rec.moving=(S.rec.moving||0)+Math.min(dt,30); } moved=true;
          const n=Math.min(40,Math.floor(d/6)); // fill the gap between fixes so nothing is skipped
          for(let k=1;k<n;k++) pts.push([last.ll[0]+(lat-last.ll[0])*k/n, last.ll[1]+(lng-last.ll[1])*k/n]);
        }
        last={ll:here,t:now}; logTrack(lat,lng,acc,src); recPoint(lat,lng);
      }
    }
    const r=claimAlong(pts), fresh=r.fresh; if(S.rec)S.rec.newSegments+=fresh.length;
    const streakUp=updateStreak();
    if(fresh.length){ fresh.forEach(markClaimed); onFreshClaims(fresh); buzz(30); }
    else renderRecBar();
    if(fresh.length||moved||r.visited||streakUp){ checkBadges(fresh.length>0); saveSoon(); render(); syncSoon(); }
  }
  queueFog();
}

/* =====================================================================
   REAL GPS — navigator.geolocation.watchPosition
   ===================================================================== */
let watchId=null, wakeLock=null;
const GEO_OPTS={enableHighAccuracy:true, maximumAge:1000, timeout:10000};
function startGPS(){
  if(!('geolocation' in navigator)) return gpsProblem('This browser has no location support.','Try Safari on iPhone or Chrome on Android.');
  if(!window.isSecureContext) return gpsProblem('GPS needs a secure (https) page.','Open this app from its https:// address.');
  if(watchId!==null)return;
  if(!S.rec) S.rec={at:Date.now(),meters:0,newSegments:0,moving:0,newPaths:0,pts:[],seen:{}}; saveNow(); go('explore');
  setStatus('warn','Finding GPS…');
  watchId=navigator.geolocation.watchPosition(
    p=>onFix(p.coords.latitude,p.coords.longitude,p.coords.accuracy||999,'gps'),
    err=>{
      if(err.code===1){ stopGPS(); gpsProblem('Location permission was denied.','To use real GPS, allow location for this site (iPhone: Settings → Privacy & Security → Location Services → Safari Websites → While Using; then reload). On Android: tap the lock icon by the address → Permissions → Location → Allow.'); }
      else if(err.code===2) setStatus('bad','GPS unavailable — still trying');
      else setStatus('warn','GPS timeout — still trying');
    }, GEO_OPTS);
  follow=true; $('fabFollow').classList.add('on');
  lockScreen(); setTrackUI(true);
}
function stopGPS(){
  if(watchId!==null){ navigator.geolocation.clearWatch(watchId); watchId=null; }
  if(wakeLock){ try{wakeLock.release();}catch(e){} wakeLock=null; }
  last=null; setTrackUI(false); setStatus('', 'GPS off'); finishRecording(); saveNow();
}
function lockScreen(){ // keep the screen awake so the browser keeps delivering GPS fixes
  if('wakeLock' in navigator) navigator.wakeLock.request('screen').then(w=>{wakeLock=w;}).catch(()=>{});
}
document.addEventListener('visibilitychange',()=>{
  if(document.visibilityState==='hidden'){ saveNow(); flush(); }
  else if(watchId!==null){ last=null; lockScreen(); }
});

  modal(title,'<p>'+body+'</p>',[
    ['Try GPS again','pri',()=>startGPS()],
    ['Close','',()=>{}]]);

/* =====================================================================

   ===================================================================== */
let NUDGES=[], pingMarker=null;
const COMPASS=['N','NE','E','SE','S','SW','W','NW'];
function bearing(a,b){ const p=toXY(a[0],a[1]), q=toXY(b[0],b[1]); return COMPASS[Math.round(((Math.atan2(q[0]-p[0],q[1]-p[1])*180/Math.PI)+360)%360/45)%8]; }
function fmtD(m){ return m<160 ? Math.max(10,Math.round(m*3.28084/10)*10)+' ft' : (m/1609.344).toFixed(m<1600?2:1)+' mi'; }
function nearest(filter){
  const from = pos ? [pos.lat,pos.lng] : [map.getCenter().lat,map.getCenter().lng];
  const xy=toXY(from[0],from[1]); let best=null, bd=Infinity;
  for(let i=0;i<SEGS.length;i++){ const s=SEGS[i]; if(!filter(s)) continue; const d=distToSeg(xy,s); if(d<bd){bd=d;best=s;} }
  return best ? {s:best, d:bd, dir:bearing(from,best.mid), here:!!pos} : null;
}
function where(n){ return n ? (n.here ? ' · '+fmtD(n.d)+' '+n.dir : '') : ''; }
function zoneName(id){ return (ZONES.find(z=>z.id===id)||{name:id}).name; }
function buildNudges(p){
  const out=[], t=dkey();
  const add=(score,text,n,tab)=>out.push({score,text,target:n&&n.s?n.s.mid:null,tab});
  // streak
  const sNow=p.streak, todayDone=S.streak.last===t;
  if(!todayDone){
    const need=STREAK_SEGS-Math.min(Object.keys(S.day.seen).length,STREAK_SEGS);
    const late=new Date().getHours()>=15;
    if(sNow>0) add(30,'Walk today to keep your '+sNow+'-day streak — rest days are fine',nearest(s=>!S.claimed[s.id]));
  }
  // zones close to complete
  ZONES.forEach(z=>{ const zz=p.z[z.id]; if(!zz||!zz.n) return; const rem=zz.n-zz.gotN;
    if(rem>0 && rem<=Math.max(3,Math.ceil(zz.n*0.08))) add(90-rem,'Almost done with '+z.name+' — '+rem+' short section'+(rem>1?'s':'')+' left',nearest(s=>s.zone===z.id&&!S.claimed[s.id]));
  });
  // territory
  if(typeof cloud!=='undefined' && cloud.territory && cloud.profile && cloud.profile.dorm){
    const my=cloud.profile.dorm;
    ZONES.forEach(z=>{
      const rows=cloud.territory.filter(r=>r.zone===z.id); if(!rows.length) return;
      const lead=rows[0], mine=rows.find(r=>r.is_my_dorm);
      const tgt=nearest(s=>s.zone===z.id&&!S.week.visits[s.id]);
      if(mine && mine.rank>1){ const gap=lead.points-mine.points+1; if(gap<=20) add(88-gap,'⚔️ '+gap+' pts to take '+z.name+' from '+lead.dorm+where(tgt),tgt); }
      else if(mine && mine.rank===1 && rows[1]){ const gap=mine.points-rows[1].points; if(gap<=5) add(80-gap,'🛡️ Defend '+z.name+': '+rows[1].dorm+' is '+gap+' behind'+where(tgt),tgt); }
      else if(!mine && rows.length && lead.points<=10) add(55,'🚩 '+z.name+' is up for grabs — '+lead.dorm+' has only '+lead.points+where(tgt),tgt);
    });
  }
  // weekly leaderboard
  if(typeof cloud!=='undefined' && cloud.weekBoard){
    const me=cloud.weekBoard.find(r=>r.is_me);
    if(me && me.rank>1){ const above=cloud.weekBoard.filter(r=>r.rank<me.rank).pop();
      if(above){ const gap=Number(above.segments)-Number(me.segments)+1; if(gap<=25) add(76-gap,gap+' more path section'+(gap>1?'s':'')+' to pass '+above.name+' this week',nearest(s=>!S.week.visits[s.id])); } }
  }
  // badge sets
  [['stairs','🪜','staircase','stairsA','Stair Master'],['bridge','🌉','bridge','bridgeA','Troll Toll'],['goat','🐐','goat path','goatA','Off-Trail Legend']].forEach(b=>{
    const tg=p.tag[b[0]], rem=tg[1]-tg[0];
    if(!S.badges[b[3]] && rem>0 && rem<=3){ const n=nearest(s=>!S.claimed[s.id]&&s.tags.indexOf(b[0])>=0); add(62-rem,b[1]+' '+rem+' '+b[2]+(rem>1?'s':'')+' left for '+b[4]+where(n),n); }
  });
  // something special nearby
  if(pos){
    const st=nearest(s=>!S.claimed[s.id]&&s.tags.length>0);
    if(st && st.d<220) add(70-st.d/10,(st.s.tags[0]==='stairs'?'🪜 Unclaimed stairs':st.s.tags[0]==='bridge'?'🌉 Unclaimed bridge':'🐐 Unclaimed goat path')+where(st),st);
  }
  // miles
  [[1,'First Mile'],[5,'Five-Miler'],[13.1,'Half Marathon']].forEach(m=>{ const r=m[0]-p.miles; if(r>0&&r<=0.25) add(50,'🥾 '+r.toFixed(2)+' mi to '+m[1]); });
  // fallback
  const n=nearest(s=>!S.claimed[s.id]);
  if(n) add(10,'🧭 Nearest new path: '+nameOf(n.s)+where(n),n);
  // naming rights
  if(typeof cloud!=='undefined' && cloud.user && pos){
    const nm=nearest(s=>S.claimed[s.id] && canBeNamed(s.pid) && !NAMES[s.pid]);
    if(nm && nm.d<120){ out.push({score:48, text:'✏️ Name the path you walked — it\'ll show on everyone\'s map', target:nm.s.mid, seg:nm.s}); }
  }
  return out.sort((a,b)=>b.score-a.score);
}

function nameProblem(raw){
  const p=String(raw||'').replace(/\s+/g,' ').trim();
  if(p.length<3||p.length>30) return 'Names must be 3–30 characters';
  if(!/^[A-Za-z0-9 '’&.,!?()#-]+$/.test(p)) return 'Use letters, numbers, spaces and basic punctuation';
  if(/(https?|www\.|\.(com|net|org|io|gg|edu|ly)\b)/i.test(p)) return 'No links, please';
  if(/[0-9]{6,}/.test(p)) return 'No phone numbers or long codes';
  const tr={'0':'o','1':'i','3':'e','4':'a','5':'s','7':'t','!':'i','8':'b'};
  const n=p.toLowerCase().replace(/[0134578!]/g,c=>tr[c]);
  const sq=n.replace(/[^a-z]/g,''), col=sq.replace(/(.)\1+/g,'$1');
  if(NF.roots.some(r=>sq.indexOf(r)>=0) || NF.stretch.some(r=>col.indexOf(r)>=0)) return 'Please keep names clean';
  if(n.replace(/[^a-z]+/g,' ').trim().split(' ').some(t=>NF.words.indexOf(t)>=0||NF.words.indexOf(t.replace(/(.)\1+/g,'$1'))>=0)) return 'Please keep names clean';
  return null;
}
const labelLayer=L.layerGroup();
function drawNameLabels(){

    const p=PATH_BY_ID[pid]; if(!p||!p.pts||p.pts.length<2) return;
    let tot=0; const d=[]; for(let i=1;i<p.pts.length;i++){ const x=distM(p.pts[i-1],p.pts[i]); d.push(x); tot+=x; }
    let acc=0, mid=p.pts[0];
    for(let i=0;i<d.length;i++){ if(acc+d[i]>=tot/2){ const t=(tot/2-acc)/(d[i]||1); mid=[p.pts[i][0]+(p.pts[i+1][0]-p.pts[i][0])*t, p.pts[i][1]+(p.pts[i+1][1]-p.pts[i][1])*t]; break; } acc+=d[i]; }
    L.tooltip({permanent:true, direction:'center', className:'pname', interactive:false, opacity:1}).setLatLng(mid).setContent(esc(NAMES[pid].name)).addTo(labelLayer);
  });

let pathHL=null;
function pathAt(latlng){
  const xy=toXY(latlng.lat,latlng.lng);
  const mpp=156543.03392*Math.cos(latlng.lat*Math.PI/180)/Math.pow(2,map.getZoom());
  const tol=Math.max(8, 22*mpp); let best=null, bd=tol;
  for(let i=0;i<SEGS.length;i++){ const s=SEGS[i]; if(Math.abs(xy[0]-s.cx)>s.rr+tol||Math.abs(xy[1]-s.cy)>s.rr+tol) continue; const d=distToSeg(xy,s); if(d<bd){ bd=d; best=s; } }
  return best;
}

async function flush(){
  if(!cloud.sb||!cloud.user||cloud.syncing||!navigator.onLine) return;
  cloud.syncing=true; setSync('');
  try{
    const cids=Object.keys(S.pending.claims);
    if(cids.length){
      const {error}=await cloud.sb.from('claims').upsert(
        cids.map(id=>({segment_id:id, claimed_at:new Date(S.pending.claims[id]).toISOString()})),
        {onConflict:'user_id,segment_id', ignoreDuplicates:true});
      if(error) throw error;
      cids.forEach(id=>delete S.pending.claims[id]);
    }
    const bids=Object.keys(S.pending.badges);
    if(bids.length){
      const {error}=await cloud.sb.from('user_badges').upsert(
        bids.map(id=>({badge_id:id, unlocked_at:new Date(S.pending.badges[id]).toISOString()})),
        {onConflict:'user_id,badge_id', ignoreDuplicates:true});
      if(error) throw error;
      bids.forEach(id=>delete S.pending.badges[id]);
    }
    const {error}=await cloud.sb.rpc('set_meters',{p_meters:S.meters});
    if(error) throw error;
    let weekChanged=false;
    if(S.pending.week){
      const r=await cloud.sb.rpc('set_week_points',{p_week:S.week.id, p_points:weekPoints()});
      if(r.error && !/this week or last week/i.test(r.error.message)) throw r.error;
      S.pending.week=false; weekChanged=true;
    }
    if(S.pending.streak && S.streak.last){

      if(r.error && !/invalid streak date/i.test(r.error.message)) throw r.error;
      S.pending.streak=false;
    }
    cloud.syncing=false; saveSoon(); setSync('',true);

    const err=c.error||b.error||st.error; if(err) throw err;
    const srvC={}, srvB={};
    c.data.forEach(r=>{ srvC[r.segment_id]=1; if(!S.claimed[r.segment_id]) S.claimed[r.segment_id]=Date.parse(r.claimed_at)||Date.now(); });
    b.data.forEach(r=>{ srvB[r.badge_id]=1; if(!S.badges[r.badge_id]) S.badges[r.badge_id]=Date.parse(r.unlocked_at)||Date.now(); });
    Object.keys(S.claimed).forEach(id=>{ if(!srvC[id]) S.pending.claims[id]=S.claimed[id]; });
    Object.keys(S.badges).forEach(id=>{ if(!srvB[id]) S.pending.badges[id]=S.badges[id]; });
    if(st.data && st.data.meters>S.meters) S.meters=st.data.meters;
    if(st.data && st.data.streak_last && (!S.streak.last || st.data.streak_last>S.streak.last)){
      S.streak.count=st.data.streak; S.streak.last=st.data.streak_last; }
    if(st.data && st.data.best_streak>S.streak.best) S.streak.best=st.data.best_streak;
    if(S.streak.last && (!st.data || !st.data.streak_last || S.streak.last>st.data.streak_last)) S.pending.streak=true;
    if(Object.keys(S.week.visits).length) S.pending.week=true;
    saveNow(); drawPaths(); render(); queueFog();
    await flush();
  }catch(e){ setSync(e.message||String(e)); }
}

function nickTyped(e){

  nickBusy(true); setNickMsg('Saving…');
  const r=await nickRpc('set_username',{p_name:v});

    cloud.profile=Object.assign({},cloud.profile,{username:r.name, name_state:'ok', username_changed_at:r.unchanged?cloud.profile.username_changed_at:new Date().toISOString()});

  if(/rate limit|security purposes/i.test(m)) return 'Too many tries — wait a minute, then try again.';

/* ---------- path indexes for goals (stable OSM way IDs) ---------- */
function indexPaths(){
  SEG_META={}; PATH_SEGN={}; PATH_SEGS={}; PATH_LEN={};
  SEGS.forEach(s=>{ SEG_META[s.id]={pid:s.pid,zone:s.zone,len:s.len}; PATH_SEGN[s.pid]=(PATH_SEGN[s.pid]||0)+1; PATH_LEN[s.pid]=(PATH_LEN[s.pid]||0)+s.len; (PATH_SEGS[s.pid]=PATH_SEGS[s.pid]||[]).push(s.id); });
}
function denverMidnight(k){
  const a=k.split('-').map(Number);
  for(const off of [6,7]){ const t=Date.UTC(a[0],a[1]-1,a[2],off);
    const h=new Date(t).toLocaleString('en-US',{timeZone:TZ,hour:'2-digit',hour12:false}); if(h==='00'||h==='24') return t; }
  return Date.UTC(a[0],a[1]-1,a[2],7);
}
function weekStartMs(){ return denverMidnight(weekKey(dkey())); }
function hist(){ return RoamStudent.pathHistory(S.claimed,SEG_META,PATH_SEGN,PATH_LEN); }
function weekAct(h){ return RoamStudent.activitySince(h||hist(), S.sessions||[], weekStartMs(), {skipZones:['campus']}); }
function namedZones(p){ return ZONES.filter(z=>z.id!=='campus'&&p.z[z.id]&&p.z[z.id].n); }
function zonesLeft(h,p){ return namedZones(p).filter(z=>!h.zones[z.id]).length; }

function pathTitle(pid){
  const n=NAMES[pid]; if(n) return n.name;
  const p=PATH_BY_ID[pid]; if(!p) return 'a path';
  return p.official ? p.name : 'an unnamed '+p.name.toLowerCase();
}
function pathMid(p){
  let tot=0; const d=[]; for(let i=1;i<p.pts.length;i++){ const x=distM(p.pts[i-1],p.pts[i]); d.push(x); tot+=x; }
  let acc=0; for(let i=0;i<d.length;i++){ if(acc+d[i]>=tot/2){ const t=(tot/2-acc)/(d[i]||1); return [p.pts[i][0]+(p.pts[i+1][0]-p.pts[i][0])*t, p.pts[i][1]+(p.pts[i+1][1]-p.pts[i][1])*t]; } acc+=d[i]; }
  return p.pts[0];
}

function shapeSVG(shape,stroke){
  const ky=111320, kx=111320*Math.cos(40*Math.PI/180);
  const xs=shape.map(p=>p[1]*kx), ys=shape.map(p=>-p[0]*ky);
  const minx=Math.min(...xs), maxx=Math.max(...xs), miny=Math.min(...ys), maxy=Math.max(...ys);
  const w=Math.max(maxx-minx,1), h=Math.max(maxy-miny,1), s=90/Math.max(w,h), ox=(100-w*s)/2, oy=(100-h*s)/2;
  const pts=shape.map((p,i)=>((xs[i]-minx)*s+ox).toFixed(1)+','+((ys[i]-miny)*s+oy).toFixed(1)).join(' ');
  return '<svg viewBox="0 0 100 100" preserveAspectRatio="xMidYMid meet" aria-hidden="true"><polyline points="'+pts+'" fill="none" stroke="'+(stroke||'currentColor')+'" stroke-width="'+(stroke?3.5:4)+'" stroke-linecap="round" stroke-linejoin="round"/></svg>';
}

/* ---------- one useful next action, derived from real data ---------- */
let NEXT=null;
function nextAction(p,h,a,rows){
  const cn=commuteNext(); if(cn) return cn;
  const need=id=>rows.find(r=>r.id===id&&!r.done);
  if(need('paths')){ const n=nearest(s=>!(h.paths[s.pid]&&h.paths[s.pid].visited)); if(n) return {ic:'route',title:'Visit a new path',sub:cap(pathTitle(n.s.pid))+where(n),target:n.s.mid}; }
  if(need('zone')){ const n=nearest(s=>s.zone!=='campus'&&!h.zones[s.zone]); if(n) return {ic:'pin',title:'Explore '+zoneName(n.s.zone),sub:'A zone you haven’t walked yet'+where(n),target:n.s.mid}; }
  if(need('complete')){
    let best=null; Object.keys(h.paths).forEach(pid=>{ const x=h.paths[pid]; if(!x.complete&&x.total>1&&(!best||x.got/x.total>best.r)) best={pid,r:x.got/x.total}; });
    if(best){ const n=nearest(s=>s.pid===best.pid&&!S.claimed[s.id]); const left=(PATH_SEGS[best.pid]||[]).filter(id=>!S.claimed[id]).reduce((m,id)=>m+(SEG_BY_ID[id]?SEG_BY_ID[id].len:0),0);
      if(n) return {ic:'check',title:'Finish '+pathTitle(best.pid),sub:'About '+fmtD(left)+' left'+where(n),target:n.s.mid}; }
  }
  if(cloud.user&&cloud.profile&&cloud.profile.dorm&&cloud.territory){
    let best=null; ZONES.forEach(z=>{ const rows2=cloud.territory.filter(r=>r.zone===z.id); const mine=rows2.find(r=>r.is_my_dorm);
      if(rows2.length&&mine&&Number(mine.rank)>1){ const gap=rows2[0].points-mine.points+1; if(gap<=15&&(!best||gap<best.gap)) best={z,gap,lead:rows2[0].dorm}; } });
    if(best){ const n=nearest(s=>s.zone===best.z.id&&!S.week.visits[s.id]); return {ic:'flag',title:'Help '+cloud.profile.dorm+' lead '+best.z.name,sub:best.gap+' more points passes '+best.lead+where(n),target:n?n.s.mid:null,go:n?null:'community'}; }
  }
  if(need('walks')&&!S.rec){ const r=need('walks'); return {ic:'walk',title:'Record a walk',sub:r.value+' of '+r.target+' walks this week',record:true}; }
  if(rows.length&&rows.every(r=>r.done)) return {ic:'check',title:'This week’s goals are done',sub:'Nice work. Wander more or take a rest — both count.',none:true};
  const n=nearest(s=>!S.claimed[s.id]); if(n) return {ic:'route',title:'Walk somewhere new',sub:cap(pathTitle(n.s.pid))+where(n),target:n.s.mid};
  return null;
}
const cap=t=>t.charAt(0).toUpperCase()+t.slice(1);
function nextHTML(n){ NEXT=n; return '<button class="next" data-act="next"><span class="ic">'+icon(n.ic,'sm')+'</span><span class="grow"><b>'+esc(n.title)+'</b><small>'+esc(n.sub||'')+'</small></span>'+(n.none?'':icon('chev','sm'))+'</button>'; }
function doNext(n){
  if(!n||n.none) return;
  if(n.plan) return planDetail(n.plan);
  if(n.leg!=null) return showRoute(planFor(n.ymd),n.leg,S.quest&&S.quest.kind==='gap'&&S.quest.ymd===n.ymd&&S.quest.leg===n.leg?'gap':true);
  if(n.record) return startRecordingFlow();

/* One class day: legs between stops, each with a direct route and maybe a scenic one. */
function dayPlan(ymd){
  if(!SCHED||!BLD) return null;
  const g=graph(), home=SCHED.home;
  let stops=RS.dayStops(SCHED.classes,ymd,home);
  if(!home) stops=stops.filter(s=>s.kind!=='home');
  const legs=[]; let meters=0, approx=false;
  for(let i=0;i<stops.length-1;i++){
    const A=stops[i], B=stops[i+1], pa=A.kind==='home'?home:placeFor(A.code), pb=B.kind==='home'?home:placeFor(B.code);
    const leg={i, from:A, to:B, arrive:B.kind==='class'?B.start:null, leave:A.kind==='class'?A.end:null};
    legs.push(leg);
    if(!pa||!pb){ leg.missing=true; continue; }
    const na=RS.placeNode(g,pa), nb=RS.placeNode(g,pb), crow=RS.hav([pa.lat,pa.lng],[pb.lat,pb.lng]);
    if(!na||!nb||na.gap>RS.OFF_NET_M||nb.gap>RS.OFF_NET_M){ leg.off=true; leg.meters=crow*1.3; approx=true; }
    else if(na.node===nb.node){ leg.same=true; leg.meters=0; }
    else{
      const r=RS.commuteLeg(g,na.node,nb.node,unwalked);
      if(!r){ leg.off=true; leg.meters=crow*1.3; approx=true; }
      else{ leg.direct=r.direct; leg.scenic=r.scenic; leg.meters=r.direct.meters+na.gap+nb.gap; leg.ends=[pa,pb]; leg.nodes=[na.node,nb.node];
        if(r.scenic){ leg.scenicNew=newIds(r.scenic.keys).length;
          // the unit students already know from the weekly goal: paths they've never been on
          const H=hist(); leg.scenicPaths=[...new Set(r.scenic.keys.map(k=>k.slice(0,k.lastIndexOf('.'))))].filter(pid=>!(H.paths[pid]&&H.paths[pid].visited)).length;
          leg.scenicGain=r.scenic.fresh-r.direct.fresh; } }
    }
    meters+=leg.meters||0;
  }
  addFoodAndGaps(g, legs);
  return {ymd, stops, legs, meters, approx};
}
/* Between two classes: a food stop (one per day, in the longest lunchtime gap) and a gap loop for longer free time. */
function addFoodAndGaps(g, legs){
  const between=legs.filter(l=>l.nodes&&l.leave&&l.arrive);
  const mode=SCHED.food||'off';
  if(mode!=='off'){
    const lunch=between.filter(l=>l.leave<'14:00'&&l.arrive>'10:30'&&tMin(l.arrive)-tMin(l.leave)>=35)
      .sort((x,y)=>(tMin(y.arrive)-tMin(y.leave))-(tMin(x.arrive)-tMin(x.leave)))[0];
    if(lunch){
      const gap=tMin(lunch.arrive)-tMin(lunch.leave);
      let best=null;

    const budget=Math.min(25,Math.max(15,(gap-10)*0.5))*60*RS.WALK_MPS;   // about half the free time, 15–25 min of walking

  const btns=[['Add to calendar','pri',()=>calModal(x)],['Show on map','',()=>showPlan(x)]];
  if(x.mine&&x.status==='invited') btns.push(['Send invite again','',()=>{ const url=location.origin+location.pathname+'#invite='+b64u(JSON.stringify({v:1,id:x.id,from:myName()||'A friend',to:x.with,date:x.date,s:x.s,e:x.e,lat:x.lat,lng:x.lng,place:x.place}));
    shareLink(url,'Meet up? · BuffPrints',(myName()||'A friend')+' wants to meet at '+t12(x.s)+', '+x.place+'. Tap to accept or decline.'); }]);
  btns.push(['Remove','danger',()=>{ PLANS=PLANS.filter(p=>p.id!==id); savePlans(); render(); if(VIEW==='explore') renderExplore(); toast('Meet-up removed'+(x.status==='confirmed'||x.status==='accepted'?' — let '+x.with+' know':'')); }]);
  modal('Meet '+x.with,'<p><b>'+esc(dayTitle(x.date,RS.denverToday().date))+' · '+t12(x.s)+'–'+t12(x.e)+'</b><br>'+esc(x.place)+'</p><p class="note">'+esc(PLAN_LABEL[x.status]||x.status)+(x.status==='invited'?'. It’s confirmed when '+esc(x.with)+' sends their reply link and you open it.':'')+'</p>',btns);
}
function showPlan(x){
  clearRoute(true); ROUTE_LAYER=L.layerGroup().addTo(map);
  L.marker([x.lat,x.lng],{icon:L.divIcon({className:'',html:'<div class="stopmk">'+icon('users','sm')+'&nbsp;Meet</div>',iconSize:null}),interactive:false,keyboard:false,pane:'routePane'}).addTo(ROUTE_LAYER);
  CUR_MEET=null; ROUTE_VIEW={meet:true, plan:x.id, title:'Meet '+x.with+' · '+t12(x.s)+'–'+t12(x.e), sub:x.place+' · '+(PLAN_LABEL[x.status]||x.status)};
  if(VIEW!=='explore') go('explore');
  follow=false; $('fabFollow').classList.remove('on'); setSheet(false);
  setTimeout(()=>{ map.invalidateSize(); map.setView([x.lat,x.lng],18); renderExplore(); },80);
}

function defaultClassDay(now){
  let day=RS.nextClassDay(SCHED.classes,now.date);
  if(day===now.date){ const last=RS.classesOn(SCHED.classes,day).filter(c=>c.code).pop(); if(last&&tMin(last.end)<tMin(now.time)) day=RS.nextClassDay(SCHED.classes,RS.addDays(now.date,1)); }
  return day;
}

  if(SCHED.classes.every(c=>c.online)) return head+'<p class="empty">All of your classes are online, so there are no walks to plan.</p>';

    '<button class="mbtn" data-act="clsWeek" data-n="7" aria-label="Next week">'+icon('chev','sm')+'</button></div>'+
    '<div class="daypick" role="group" aria-label="Choose a day" style="--n:'+week.length+'">'+week.map(d=>{
      const n=RS.classesOn(SCHED.classes,d).length, cd=RS.campusDay(d), wd=RS.weekday(d);
      return '<button data-act="clsDay" data-ymd="'+d+'" class="'+(d===day?'on ':'')+(n?'':'none ')+(d===now.date?'today':'')+'" aria-pressed="'+(d===day)+'" aria-label="'+esc(SHORT[wd]+' '+d.slice(8).replace(/^0/,'')+': '+(cd.off?cd.reason:pl(n,'class','classes'))+(d===now.date?', today':''))+'">'+
        '<b>'+SHORT[wd]+'</b><span>'+d.slice(8).replace(/^0/,'')+'</span><i>'+(cd.off?'off':n||'–')+'</i></button>';
    }).join('')+'</div>';
  const cd=RS.campusDay(day), list=RS.classesOn(SCHED.classes,day);
  if(cd.off) h+='<p class="empty">No classes '+esc(dayTitle(day,now.date).replace(/^(Today|Tomorrow)$/,s=>s.toLowerCase()))+' — '+esc(cd.reason)+'.</p>';
  else if(!list.length) h+='<p class="empty">No in-person classes '+esc(dayTitle(day,now.date).replace(/^(Today|Tomorrow)$/,s=>s.toLowerCase()))+'.</p>';
  else{
    const plan=planFor(day); CUR_PLAN=plan;
    const nCls=plan.stops.filter(s=>s.kind==='class').reduce((m,s)=>m+s.classes.length,0);
    h+='<div class="cday"><div class="ctop"><b>'+esc(dayTitle(day,now.date))+'</b><span>'+pl(nCls,'class','classes')+(plan.meters?' · '+(plan.approx?'about ':'')+fmtD(plan.meters)+' · '+fmtDur(RS.minutes(plan.meters)):'')+'</span></div>'+
      (cd.asMonday?'<p class="note" style="margin:2px 0 6px">Campus follows a Monday schedule this day.</p>':'');
    plan.stops.forEach(st=>{
      if(st.kind!=='class') return;
      const leg=plan.legs.find(l=>l.to===st), nm=bldName(st.code);
      let warn='';
      if(leg&&leg.meters&&!leg.missing){
        const walk=RS.minutes(leg.meters);
        if(leg.leave){ const gap=tMin(leg.arrive)-tMin(leg.leave);
          if(walk>gap) warn='<small class="tight">'+icon('alert','sm')+'Tight: '+gap+' min between classes, '+walk+' min walk</small>'; }
        else if(leg.from.kind==='home'){ const by=tMin(st.start)-walk-3;
          warn='<small class="leave">Leave '+esc(SCHED.home.name)+' by '+t12(String(Math.floor(by/60)).padStart(2,'0')+':'+String(by%60).padStart(2,'0'))+'</small>'; }
      }
      if(leg&&leg.food) h+=foodRowHTML(leg);
      if(leg&&leg.explore) h+=gapRowHTML(leg);
      h+='<div class="cls"><div class="t">'+t12(st.start).replace(' ','<small>')+'</small></div><div class="grow"><b>'+esc(stopCourses(st))+'</b>'+
        '<small>'+esc(dispCode(st.code)+(nm?' · '+nm:''))+(leg?' · '+esc(legLine(leg)):'')+'</small>'+warn+(leg?scenicChip(leg):'')+'</div></div>';
    });
    list.filter(c=>!c.code).forEach(c=>{ h+='<div class="cls"><div class="t">'+t12(c.start).replace(' ','<small>')+'</small></div><div class="grow"><b>'+esc(c.course)+'</b><small class="tight">Building not set</small></div></div>'; });
    const back=plan.legs.find(l=>l.to.kind==='home');
    if(back) h+='<div class="cls back"><div class="t">'+icon('home','sm')+'</div><div class="grow"><b>Back to '+esc(SCHED.home.name)+'</b><small>'+esc(legLine(back))+'</small>'+scenicChip(back)+'</div></div>';

    if(plan.legs.some(l=>l.direct)) h+='<div class="btns"><button class="btn" data-act="commuteMap">'+icon('map','sm')+'Show this day on the map</button></div>';
    h+=meetupsHTML(day, cd.wd, list);
  }
  // totals: this week, and the rest of the term
  const wk=sumWalk(RS.classDates(SCHED.classes,mon,RS.addDays(mon,6)));
  const term=RS.termFor(day)||RS.termFor(now.date);
  if(wk.m||term){
    const from=term&&now.date>term.start?now.date:term&&term.start, left=term?sumWalk(RS.classDates(SCHED.classes,from,term.end)):null;
    const all=term?sumWalk(RS.classDates(SCHED.classes,term.start,term.end)):null;
    const about=x=>x&&x.approx?'about ':'';
    h+='<div class="week wtot"><div><b>'+(wk.m?fmtMi(wk.m):'0 mi')+'</b><span>'+(wk.m?about(wk)+'this week · '+fmtDur(RS.minutes(wk.m)):'no classes this week')+'</span></div>'+
      (left?'<div><b>'+fmtMi(left.m)+'</b><span>'+about(left)+'left in '+esc(term.name)+'</span></div><div><b>'+fmtMi(all.m)+'</b><span>'+about(all)+'whole term</span></div>':'')+'</div>'+
      '<p class="note">Direct routes'+(SCHED.home?' from '+esc(SCHED.home.name)+' and back':' between classes only — set where you start to include the walk there and back')+', staying on campus between classes. Breaks and holidays are skipped.</p>';
  }
  const miss=missingCodes();
  if(unset) h+='<button class="row" data-act="sched"><span class="grow"><b>Choose buildings for '+pl(unset,'class','classes')+'</b><small>Your schedule file didn’t list where '+(unset===1?'it meets':'they meet')+'</small></span>'+icon('chev','sm')+'</button>';
  if(!SCHED.home) h+='<button class="row" data-act="sched"><span class="grow"><b>Set where you start your day</b><small>Adds the walk from your dorm, a parking garage or a spot you pick</small></span>'+icon('chev','sm')+'</button>';
  if(miss.length) h+='<button class="row" data-act="sched"><span class="grow"><b>Place '+pl(miss.length,'building')+' on the map</b><small>'+esc(miss.map(dispCode).join(', '))+' isn’t in the campus building list yet</small></span>'+icon('chev','sm')+'</button>';
  return h;
}

/* ---------- the Next card: a scenic route to an upcoming class ---------- */
function commuteNext(){
  if(S.rec) return null;
  const now=RS.denverToday();
  const soon=PLANS.filter(x=>x.date===now.date&&x.status!=='declined'&&tMin(x.s)>=tMin(now.time)-5&&tMin(x.s)-tMin(now.time)<=120).sort((a,b)=>a.s.localeCompare(b.s))[0];
  if(soon) return {ic:'users', title:'Meet '+soon.with+' at '+t12(soon.s), sub:soon.place+' · '+(PLAN_LABEL[soon.status]||soon.status), plan:soon.id};
  if(!SCHED||!BLD) return null;
  if(S.quest&&S.quest.ymd===now.date){
    const q=S.quest, got=q.segs.filter(id=>S.claimed[id]&&S.claimed[id]>=q.at).length;
    return {ic:'trail', title:'Finish the '+(q.kind==='gap'?'gap loop':'scenic route')+' to '+q.to, sub:Math.round(got/q.segs.length*100)+'% walked · 80% completes it', leg:q.leg, ymd:q.ymd};
  }
  const plan=planFor(now.date); if(!plan) return null;
  const m=tMin(now.time), leg=plan.legs.find(l=>l.arrive&&tMin(l.arrive)>m&&tMin(l.arrive)-m<=180&&l.scenic);
  if(!leg) return null;
  return {ic:'trail', title:'Scenic route to '+stopCourses(leg.to), sub:'+'+extraMin(leg)+' min · '+scenicWhat(leg)+' · class at '+t12(leg.arrive), leg:leg.i, ymd:plan.ymd};
}

/* ---------- map ---------- */
map.createPane('routePane').style.zIndex=470;
const ROUTE_REN=L.canvas({pane:'routePane'});
function clearRoute(keepQuest){
  if(ROUTE_LAYER){ map.removeLayer(ROUTE_LAYER); ROUTE_LAYER=null; }
  ROUTE_VIEW=null; if(!keepQuest&&S.quest){ S.quest=null; saveSoon(); }
  if(VIEW==='explore') renderExplore();
}
function showRoute(plan, legIdx, mode){
  const scenic=mode===true||mode==='scenic', alt=l=>mode==='gap'?l.explore:mode==='food'?l.food:scenic?l.scenic:null;
  if(!plan) return;
  clearRoute(true);
  const legs=(legIdx==null?plan.legs:[plan.legs[legIdx]]).filter(l=>l&&l.direct);
  if(!legs.length) return toast('No mapped walkway route for this day yet');
  ROUTE_LAYER=L.layerGroup().addTo(map); const pts=[];
  const opt=o=>Object.assign({renderer:ROUTE_REN, interactive:false, lineCap:'round', lineJoin:'round'},o);
  legs.forEach(l=>{
    const line=l.direct.line.slice(); if(l.ends){ line.unshift([l.ends[0].lat,l.ends[0].lng]); line.push([l.ends[1].lat,l.ends[1].lng]); }
    L.polyline(line,opt({color:'#fff',weight:7,opacity:.85})).addTo(ROUTE_LAYER);
    L.polyline(line,opt({color:'#1E2022',weight:3,dashArray:'2 9'})).addTo(ROUTE_LAYER);
    const a=alt(l);
    if(a){
      L.polyline(a.line,opt({color:'#1E2022',weight:10,opacity:.5})).addTo(ROUTE_LAYER);
      L.polyline(a.line,opt({color:'#CFB87C',weight:6})).addTo(ROUTE_LAYER);
      a.line.forEach(p=>pts.push(p));
      if(mode==='food'){ const fb=BLD.by[l.food.code]; if(fb) L.marker([fb.lat,fb.lng],{icon:L.divIcon({className:'',html:'<div class="stopmk">'+icon('food','sm')+'&nbsp;Food</div>',iconSize:null}),interactive:false,keyboard:false,pane:'routePane'}).addTo(ROUTE_LAYER); }
    }
    line.forEach(p=>pts.push(p));
    [[l.from,l.ends&&l.ends[0]],[l.to,l.ends&&l.ends[1]]].forEach(([st,pl2])=>{ if(!pl2) return;
      L.marker([pl2.lat,pl2.lng],{icon:L.divIcon({className:'',html:'<div class="stopmk">'+(st.kind==='home'?icon('home','sm'):esc(isPin(st.code)?'Class':st.code))+'</div>',iconSize:null}),interactive:false,keyboard:false,pane:'routePane'}).addTo(ROUTE_LAYER); });
  });
  const l=legs[0], a=legIdx==null?null:alt(l), dest=l.to.kind==='home'?SCHED.home.name:stopCourses(l.to);
  const kind=mode==='gap'?'gap':scenic?'scenic':mode==='food'?'food':null;
  ROUTE_VIEW={ymd:plan.ymd, leg:legIdx, scenic:!!(a&&(kind==='scenic'||kind==='gap')), kind, altLabel:kind==='gap'?'Gap loop':kind==='food'?'Via food stop':'Scenic',
    title: legIdx==null?dayTitle(plan.ymd,RS.denverToday().date)+'’s walks':(a?(kind==='gap'?'Gap loop to ':kind==='food'?'Food stop on the way to ':'Scenic route to '):'Route to ')+dest,
    sub: legIdx==null?pl(legs.length,'walk')+' · '+fmtD(plan.meters):
      !a?fmtD(l.meters)+' · '+RS.minutes(l.meters)+' min':
      kind==='gap'?RS.minutes(a.meters)+' min walk · '+pl(a.newPaths,'new path')+' · direct: '+RS.minutes(l.direct.meters)+' min':
      kind==='food'?l.food.name+' · '+RS.minutes(l.food.meters)+' min of walking · '+(l.food.eat>=60?'plenty of time to eat':'about '+l.food.eat+' min to eat'):
      RS.minutes(l.scenic.meters)+' min instead of '+RS.minutes(l.direct.meters)+' · '+scenicWhat(l)};
  if(a&&(kind==='scenic'||kind==='gap')){
    const id=plan.ymd+':'+legIdx+':'+kind;
    if(!S.quest||S.quest.id!==id) S.quest={id, kind, ymd:plan.ymd, leg:legIdx, to:dest, segs:newIds(a.keys), at:Date.now()};
    saveSoon();
  }
  if(VIEW!=='explore') go('explore');
  follow=false; $('fabFollow').classList.remove('on'); setSheet(false);
  setTimeout(()=>{ map.invalidateSize(); map.fitBounds(L.latLngBounds(pts).pad(0.12)); renderExplore(); },80);
}

  const got=active?q.segs.filter(id=>S.claimed[id]&&S.claimed[id]>=q.at).length:0;

/* ---------- scenic route quests and badges ---------- */
function checkQuest(){
  const q=S.quest; if(!q) return;
  if(q.ymd<RS.denverToday().date){ S.quest=null; return; }          // a quest lasts for its class day
  const got=q.segs.filter(id=>S.claimed[id]&&S.claimed[id]>=q.at).length;
  if(q.segs.length&&got>=Math.ceil(q.segs.length*0.8)){
    S.scenic.done.push({at:Date.now(), ymd:q.ymd, n:q.segs.length, kind:q.kind||'scenic'}); S.scenic.done=S.scenic.done.slice(-200);
    S.quest=null; toast(q.kind==='gap'?'Gap loop complete':'Scenic route complete'); buzz([40,30,40,30,120]);
    if(ROUTE_VIEW&&ROUTE_VIEW.scenic) setTimeout(()=>clearRoute(true),0);
  }
}
function markKnowWay(){
  if(S.scenic.knowWay||!SCHED||!BLD) return;
  const d=RS.denverToday().date, plan=planFor(d); if(!plan) return;
  const legs=plan.legs.filter(l=>l.direct);
  if(legs.length&&!plan.legs.some(l=>l.missing)&&legs.every(l=>segsOf(l.direct.keys).every(s=>S.claimed[s.id]))) S.scenic.knowWay=Date.now();
}

    '<label class="f" for="homePick">Where you start your day</label><select class="field" id="homePick">'+homeOptions()+'</select>'+
    '<label class="f" for="foodPick">Food stop between classes</label><select class="field" id="foodPick">'+
      [['off','Off'],['auto','Nearest dining on my way']].concat(FOOD.map(f=>[f.code,f.name])).map(([v,t])=>'<option value="'+v+'"'+((SCHED.food||'off')===v?' selected':'')+'>'+esc(t)+'</option>').join('')+'</select>'+
    '<p class="note" style="margin-top:-4px">Added to your longest lunchtime gap (10:30–2:00) when there’s at least 15 minutes to eat. <a href="'+DINING_URL+'" target="_blank" rel="noopener">Dining hours</a></p>'+
    '<div class="label" style="margin-top:6px">Meet-ups <button class="more" data-act="shareMeet">Share my free times</button></div>'+
    (FRIENDS.length?'<div class="list">'+FRIENDS.map((f,i)=>'<div class="row"><span class="grow"><b>'+esc(f.n)+'</b><small>'+(f.exp&&f.exp<RS.denverToday().date?'Expired':'Shared '+esc(new Date(f.at).toLocaleDateString([], {month:'short',day:'numeric'})))+'</small></span><button class="link" data-act="rmFriend" data-i="'+i+'">Remove</button></div>').join('')+'</div>'
      :'<p class="note">Send friends a link with your class times. When they share theirs, Home shows when you’re both free and a fair place to meet.</p>')+
    '<div class="label" style="margin-top:6px">'+pl(SCHED.classes.length,'class','classes')+'</div><div class="list">'+rows+'</div>'+
    (SCHED.skipped.length?'<p class="note">Not included: '+esc(SCHED.skipped.map(s=>s.course+' ('+s.reason+')').join('; '))+'</p>':'')+
    '<p class="note">'+(terms.length?'Holidays and breaks follow CU’s '+esc(terms.join(' and '))+' calendar. ':'')+'Routes assume you stay on campus between classes. Saved only on this phone; rooms and instructors were not kept.</p>',
    [['Done','pri',()=>{ render(); }],['Replace file','',()=>$('icsFile').click()],['Remove schedule','danger',()=>modal('Remove your class schedule?','<p>This deletes the schedule, your start location and any buildings you placed from this phone. Badges you earned stay.</p>',
      [['Remove','danger',()=>{ SCHED=null; saveSched(); clearRoute(); render(); toast('Class schedule removed'); }],['Cancel','',schedModal]])]]);
}
$('icsFile').addEventListener('change',e=>{
  const f=e.target.files&&e.target.files[0]; e.target.value=''; if(!f) return;
  if(f.size>1024*1024) return modal('That file is too large','<p>A class schedule is usually a few kilobytes. Choose the .ics file of your class schedule.</p>',[['OK','pri',()=>{}]]);
  f.text().then(txt=>loadBuildings().then(()=>importICS(txt))).catch(err=>modal('Couldn’t read that file','<p>'+esc(err.message||String(err))+'</p>',[['OK','pri',()=>{}]]));
});
function importICS(text){
  let r; try{ r=RS.parseICS(text,{known:Object.keys(BLD.by)}); }
  catch(e){ return modal('Couldn’t read that file','<p>'+esc(e.message)+'</p><p class="note">Choose the calendar (.ics) file of your class schedule.</p>',[['Try another file','pri',()=>$('icsFile').click()],['Cancel','',()=>{}]]); }
  if(!r.classes.length) return modal('No classes to add','<p>The file had no weekly classes BuffPrints can use'+(r.skipped.length?' ('+esc(r.skipped.map(s=>s.course+': '+s.reason).join('; '))+')':'')+'.</p>',[['OK','pri',()=>{}]]);
  SCHED={v:1, imported:Date.now(), classes:r.classes, skipped:r.skipped.slice(0,20), home:SCHED?SCHED.home:null, pins:SCHED?SCHED.pins:{}, food:SCHED?SCHED.food:'off'};
  saveSched(); render(); toast('Added '+pl(r.classes.length,'class','classes'));
  schedModal();
}
document.addEventListener('change',e=>{
  if(e.target.id!=='foodPick'||!SCHED) return;
  SCHED.food=e.target.value; saveSched(); render(); toast(SCHED.food==='off'?'Food stop off':'Food stop on');
});
document.addEventListener('change',e=>{
  if(!SCHED||!e.target.classList.contains('bldpick')) return;
  const c=SCHED.classes.find(x=>x.id===e.target.dataset.cls), v=e.target.value; if(!c||!v) return;
  if(v==='__map'){ const code='PIN-'+c.id; c.code=code; c.online=false; saveSched(); return startPlacing(code,'where '+c.course+' meets'); }
  if(v==='__online'){ c.online=true; c.code=null; }
  else{ c.code=v; c.online=false; c.unknownPlace=null; }
  saveSched(); render(); schedModal();
});
document.addEventListener('change',e=>{
  if(e.target.id!=='homePick'||!SCHED) return;
  const v=e.target.value;
  if(v==='__pin') return startPlacing('home','where you start your day');
  if(v===''||v==='__mine') return;
  const p=BLD.places[+v]; if(!p) return;
  SCHED.home={name:p.name, kind:p.kind, lat:p.lat, lng:p.lng, outline:p.outline||[]}; saveSched(); render(); toast('Start set to '+p.name);
});
function startPlacing(what,label){
  PLACING={what}; $('modal').classList.remove('show'); modalClose=null;
  clearRoute(true); go('explore'); setSheet(false);
  let bar=$('placeBar'); if(!bar){ bar=document.createElement('div'); bar.id='placeBar'; bar.className='placebar'; bar.setAttribute('role','status'); $('mapwrap').appendChild(bar); }
  bar.innerHTML='<span class="grow">Tap '+esc(label)+' on the map.</span><button class="btn" data-act="cancelPlace">Cancel</button>'; bar.hidden=false;
  const b=placeFor(what!=='home'?what:'') ; if(b) map.setView([b.lat,b.lng],18);
}
function endPlacing(){ PLACING=null; const bar=$('placeBar'); if(bar) bar.hidden=true; }
function placeAt(ll){
  const what=PLACING&&PLACING.what; if(!what) return;
  if(ll.lat<39.95||ll.lat>40.06||ll.lng<-105.33||ll.lng>-105.18){ toast('That spot is outside Boulder. Try again.'); return; }
  const p={lat:Math.round(ll.lat*1e6)/1e6, lng:Math.round(ll.lng*1e6)/1e6};
  if(what==='home') SCHED.home={name:'My spot', kind:'pin', lat:p.lat, lng:p.lng, outline:[]}; else SCHED.pins[what]=p;
  saveSched(); endPlacing(); toast(what==='home'?'Start location saved on this phone':what+' placed'); render(); schedModal();
}

/* ---------- one click handler for the whole app ---------- */
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-go],[data-act],[data-walk],[data-zone],[data-nudge],[data-pin],[data-req],[data-leg],[data-meet],[data-plan]'); if(!t) return;
  if(t.dataset.go){ go(t.dataset.go); return; }
  if(t.dataset.leg!=null){ showRoute(CUR_PLAN,+t.dataset.leg,t.dataset.alt||true); return; }
  if(t.dataset.meet!=null){ showMeet(CUR_MEETS[+t.dataset.meet]); return; }
  if(t.dataset.plan){ planDetail(t.dataset.plan); return; }
  if(t.dataset.walk!=null){ const s=(S.sessions||[])[+t.dataset.walk]; if(s) showFinish(s,false); return; }
  if(t.dataset.nudge!=null){ goNudge(NUDGES[+t.dataset.nudge]); return; }
  if(t.dataset.pin){ const h=HAZ[t.dataset.pin]; if(h){ flyTo([h.lat,h.lng]); setTimeout(()=>L.popup().setLatLng([h.lat,h.lng]).setContent(hazardHTML(h)).openOn(map),900); } return; }
  if(t.dataset.req){ requestAction(t.dataset.req,+t.dataset.i); return; }
  if(t.dataset.zone){ const pts=[]; SEGS.forEach(s=>{ if(s.zone===t.dataset.zone) pts.push(s.a,s.b); });
    if(pts.length){ if(VIEW!=='explore') go('explore'); follow=false; $('fabFollow').classList.remove('on'); setSheet(false);
      setTimeout(()=>{ map.invalidateSize(); map.fitBounds(L.latLngBounds(pts).pad(0.15)); },80); } return; }
  const a=t.dataset.act;
  if(a==='next') doNext(NEXT);
  else if(a==='goals') editGoals();
  else if(a==='dismissWelcome'){ S.welcomed=Date.now(); saveSoon(); renderHome(); }
  else if(a==='allBadges'){ SHOW_ALL_BADGES=!SHOW_ALL_BADGES; renderProgress(); }
  else if(a==='export') exportData();
  else if(a==='privacy') openPrivacy();
  else if(a==='reset') modal('Reset all progress?','<p>This clears walked paths, miles, badges, your streak and this week’s team points on this phone'+(cloud.user?' and in your account':'')+'. Your walk history on this phone and paths you named stay.</p>',[['Reset progress','danger',resetAll],['Cancel','',()=>{}]]);
  else if(a==='report') reportHazard();
  else if(a==='draft') advocacyDraft();
  else if(a==='signin') goSignIn();
  else if(a==='nick') openNickname(t.dataset.ctx||'change');
  else if(a==='reportName') reportNickname(t.dataset.ref,t.dataset.name);
  else if(a==='reloadPins') loadHazards();
  else if(a==='reloadComm') renderCommunity();
  else if(a==='saveTeam') saveTeam($('teamPick').value,$('teamOther').value);
  else if(a==='changeTeam') modal('Change team','<p>Your walks from now on count toward the team you choose. Points already earned this week stay with your previous team’s total until Monday.</p>'+teamPickerHTML(),
      [['Save','pri',()=>saveTeam($('teamPick').value,$('teamOther').value)],['Cancel','',()=>{}]]);
  else if(a==='share'){ const box=$('shareShape'); shareWalk(FIN,!!(box&&box.checked)); }
  else if(a==='closeFinish') closeFinish();
  else if(a==='sched') openSchedule();
  else if(a==='planMeet') planMeet(CUR_MEET);
  else if(a==='shareMeet'){ $('modal').classList.remove('show'); modalClose=null; shareMeet(); }
  else if(a==='rmFriend'){ const f=FRIENDS[+t.dataset.i]; if(f){ FRIENDS.splice(+t.dataset.i,1); saveFriends(); render(); toast(f.n+' removed'); schedModal(); } }
  else if(a==='clsDay'){ CLS_SEL=t.dataset.ymd; renderHome(); }
  else if(a==='clsWeek'){ const now=RS.denverToday(), cur=CLS_SEL||defaultClassDay(now)||now.date; CLS_SEL=RS.addDays(RS.mondayOf(cur),+t.dataset.n>0?7:-7);
    const firstClass=RS.classDates(SCHED.classes,CLS_SEL,RS.addDays(CLS_SEL,6))[0]; if(firstClass) CLS_SEL=firstClass; renderHome(); }
  else if(a==='pickIcs') $('icsFile').click();
  else if(a==='commuteMap') showRoute(CUR_PLAN,null,false);
  else if(a==='clearRoute') clearRoute();
  else if(a==='placeBldg') startPlacing(t.dataset.code,'the building for '+t.dataset.code);
  else if(a==='cancelPlace'){ const w=PLACING&&PLACING.what;
    if(isPin(w)&&!SCHED.pins[w]) SCHED.classes.forEach(c=>{ if(c.code===w) c.code=null; }), saveSched();
    endPlacing(); openSchedule(); }
});
document.addEventListener('change',e=>{ if(e.target.id==='teamPick') $('teamOther').hidden=e.target.value!=='__other'; });
function goSignIn(){ go('progress'); setTimeout(()=>{ const b=$('cloudBox'); if(b) b.scrollIntoView({block:'start',behavior:REDUCED.matches?'auto':'smooth'}); const f=$('cEmail'); if(f) f.focus({preventScroll:true}); },120); }

/* ---------- connection status ---------- */
function syncOnline(){ document.body.classList.toggle('offline',!navigator.onLine); }
window.addEventListener('online',syncOnline); window.addEventListener('offline',syncOnline); syncOnline();

/* ---------- keyboard and dialog focus ---------- */
let focusBeforeModal=null;
new MutationObserver(()=>{
  if($('modal').classList.contains('show')){
    if(!$('modal').contains(document.activeElement)) focusBeforeModal=document.activeElement;
    const first=$('modal').querySelector('input:not([disabled]),select:not([disabled]),textarea:not([disabled]),button:not([disabled]),a[href]'); if(first) first.focus();
  }else if(focusBeforeModal&&focusBeforeModal.isConnected) focusBeforeModal.focus();
}).observe($('modal'),{attributes:true,attributeFilter:['class']});
document.addEventListener('keydown',e=>{
  const open=$('modal').classList.contains('show')?$('modal'):$('finish').classList.contains('show')?$('finish'):null;
  if(!open) return;
  if(e.key==='Escape'){ if(open===$('finish')) closeFinish(); else { $('modal').classList.remove('show'); if(modalClose){ modalClose(); modalClose=null; } } }
  if(e.key==='Tab'){
    const items=[...open.querySelectorAll('button:not([disabled]),input,textarea,select,a[href]')].filter(x=>x.offsetParent!==null), first=items[0], last=items[items.length-1];
    if(!first) return;
    if(e.shiftKey&&document.activeElement===first){ e.preventDefault(); last.focus(); } else if(!e.shiftKey&&document.activeElement===last){ e.preventDefault(); first.focus(); }
  }
});
$('modal').addEventListener('click',e=>{ if(e.target===$('modal')){ $('modal').classList.remove('show'); if(modalClose){ modalClose(); modalClose=null; } } });

/* ---- auth state ---- */
if(cloud.sb){
  cloud.sb.auth.onAuthStateChange((event,session)=>{
    const u=session?session.user:null;
    if((u&&u.id)===(cloud.user&&cloud.user.id)) return;
    cloud.user=u; if(!u){ cloud.step='email'; cloud.lastSync=0; cloud.err=''; }
    setTimeout(()=>{ buildCloudBox(); render(); if(u){ pull().then(loadTerritory); loadProfile(); loadHazards(); loadNames(); toast('Signed in — syncing'); } else { hazardLayer.clearLayers(); HAZ={};renderSafety(); cloud.profile=null; cloud.territory=null; cloud.weekBoard=null; }
      if(VIEW==='community') renderCommunity(); if(VIEW==='safety') renderSafety(); },0);
  });
  window.addEventListener('online',()=>flush());
}
buildCloudBox();
setupZoomCtl(); syncFogBtn();
/* Links friends send each other: #meet= (free times), #invite= (a meet-up), #reply= (yes/no). Read once, then cleared. */
const LINK_RE=/^#(meet|invite|reply)=/;
function handleLink(h){
  const kind=h.slice(1,h.indexOf('=')), raw=h.slice(h.indexOf('=')+1);
  const v=kind==='meet'?readMeetShare(raw):kind==='invite'?readInvite(raw):readReply(raw);
  if(!v) return toast('That BuffPrints link couldn’t be read');
  setTimeout(()=>kind==='meet'?offerFriend(v):kind==='invite'?offerInvite(v):takeReply(v),400);
}
const LINK_IN=location.hash||'';
if(LINK_RE.test(LINK_IN)) try{ history.replaceState(null,'',location.pathname+'#home'); }catch(e){}
go((location.hash||'').replace('#','')||'home',{keepScroll:true});
if(LINK_RE.test(LINK_IN)) handleLink(LINK_IN);
// A link opened while the app is already open only changes the #part, so listen for it too.
window.addEventListener('hashchange',()=>{ const h=location.hash||''; if(!LINK_RE.test(h)) return;
  try{ history.replaceState(null,'',location.pathname+'#home'); }catch(e){} go('home'); handleLink(h); });
drawNameLabels(); drawZoneLabels(); drawHoofs();
if(S.rec&&S.rec.at){
  modal('Unfinished walk','<p>You started a walk on '+esc(dayLabel(new Date(S.rec.at).toISOString(),true))+' that wasn’t finished. Recording stops when the app closes.</p>',
    [['Resume recording','pri',()=>startGPS()],['Finish it now','',()=>finishRecording()],['Discard it','danger',()=>{ S.rec=null; saveNow(); }]]);
} loadNames(); setInterval(()=>{ if(document.visibilityState==='visible') loadNames(); }, 5*60*1000);

/* =====================================================================
   BOOT EXTRAS — restore from IndexedDB if localStorage was wiped,
   optional paths.geojson override, service worker
   ===================================================================== */
function refreshAll(){ buildSegments(); drawPaths(); drawHoofs(); drawZoneLabels(); render(); queueFog(); }
function setStatusIfIdle(){ if(watchId===null) setStatus('', 'Ready to explore · GPS off'); }
if(!localStorage.getItem(LS_KEY)){
  idb('kv','readonly',st=>st.get('state')).then(v=>{ if(v&&v.claimed){ S=Object.assign(DEF(),v); normalize(); refreshAll(); } });
}
if(location.protocol.indexOf('http')===0){
  fetch('paths.geojson',{cache:'no-cache'}).then(r=>r.ok?r.json():null).then(g=>{
    if(!g||!g.features) return;
    if(Array.isArray(g.dorms)){ DORM_LIST=g.dorms.filter(d=>typeof d==='string').slice(0,200); if(cloud.user){ buildCloudBox(); } }
    const custom=g.features.filter(f=>f.geometry&&f.geometry.type==='LineString').map((f,i)=>({
      id:(f.properties&&f.properties.id)||('x'+i), zone:ZONES.some(z=>z.id===(f.properties&&f.properties.zone))?f.properties.zone:'campus',
      name:(f.properties&&f.properties.name)||'Walkway', tags:(f.properties&&f.properties.tags)||[],
      official:(f.properties&&f.properties.named===true)||!GENERIC_NAMES.has((f.properties&&f.properties.name)||'Walkway'),
      pts:f.geometry.coordinates.map(c=>[c[1],c[0]])}));
    if(custom.length){ PATHS=custom; refreshAll(); drawNameLabels(); setStatusIfIdle(); if(VIEW==='community') renderCommunity(); }
  }).catch(()=>{});
  if('serviceWorker' in navigator) window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
}

// read-only hooks for debugging from the console (no way to fake movement)
window.RR={state:()=>JSON.parse(JSON.stringify(S)), progress, segCount:()=>SEGS.length, nudges:()=>NUDGES.map(n=>n.text), names:()=>JSON.parse(JSON.stringify(NAMES)),
  commute:()=>CUR_PLAN?CUR_PLAN.legs.map(l=>({to:l.to.key, meters:l.meters, direct:l.direct&&l.direct.line, scenic:l.scenic&&l.scenic.line, scenicNew:l.scenicNew||0})):null, quest:()=>S.quest&&{n:S.quest.segs.length, to:S.quest.to}};
})();
</script>
