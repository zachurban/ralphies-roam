const TZ = 'America/Denver';
function dkey(){
  const d=new Date();
  try{ return d.toLocaleDateString('en-CA',{timeZone:TZ}); }
  catch(e){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
}
function addDays(k,n){ const a=k.split('-').map(Number); return new Date(Date.UTC(a[0],a[1]-1,a[2]+n)).toISOString().slice(0,10); }
function weekKey(k){ k=k||dkey(); const a=k.split('-').map(Number); return addDays(k,-((new Date(Date.UTC(a[0],a[1]-1,a[2])).getUTCDay()+6)%7)); }

/* =====================================================================
   GEOMETRY (flat-earth meters around campus — plenty accurate at 2 km)
   ===================================================================== */
const KX = Math.cos(CAMPUS[0]*Math.PI/180)*111320, KY = 110574;
const toXY = (lat,lng)=>[(lng-CAMPUS[1])*KX,(lat-CAMPUS[0])*KY];
function distM(a,b){const p=toXY(a[0],a[1]),q=toXY(b[0],b[1]);return Math.hypot(p[0]-q[0],p[1]-q[1]);}
function distToSeg(p,s){
  const dx=s.bx-s.ax, dy=s.by-s.ay, l2=dx*dx+dy*dy;
  let t=l2?((p[0]-s.ax)*dx+(p[1]-s.ay)*dy)/l2:0; t=t<0?0:t>1?1:t;
  return Math.hypot(p[0]-(s.ax+t*dx), p[1]-(s.ay+t*dy));
}
let SEGS=[], SEG_BY_ID={}, TOTAL_LEN=0;
let PATH_BY_ID={};
let SEG_META={}, PATH_SEGN={}, PATH_SEGS={}, PATH_LEN={};   // path indexes for goals (filled by indexPaths)
function buildSegments(){
  SEGS=[]; SEG_BY_ID={}; TOTAL_LEN=0; PATH_BY_ID={};
  PATHS.forEach(p=>{
    PATH_BY_ID[p.id]=p;
    for(let i=0;i<p.pts.length-1;i++){
      const A=p.pts[i], B=p.pts[i+1], d=distM(A,B), n=Math.max(1,Math.ceil(d/SEG_MAX_M));
      for(let j=0;j<n;j++){
        const a=[A[0]+(B[0]-A[0])*j/n, A[1]+(B[1]-A[1])*j/n];
        const b=[A[0]+(B[0]-A[0])*(j+1)/n, A[1]+(B[1]-A[1])*(j+1)/n];
        const axy=toXY(a[0],a[1]), bxy=toXY(b[0],b[1]);
        const s={id:p.id+'.'+i+'.'+j, pid:p.id, zone:p.zone, name:p.name, tags:p.tags||[], a, b,
                 mid:[(a[0]+b[0])/2,(a[1]+b[1])/2], ax:axy[0], ay:axy[1], bx:bxy[0], by:bxy[1], len:d/n,
                 cx:(axy[0]+bxy[0])/2, cy:(axy[1]+bxy[1])/2, rr:d/n/2+CLAIM_M};
        SEGS.push(s); SEG_BY_ID[s.id]=s; TOTAL_LEN+=s.len;
      }
    }
  });
  indexPaths();
}

/* =====================================================================
   STATE + PERSISTENCE (localStorage = fast snapshot, IndexedDB = mirror + GPS track log)
   ===================================================================== */
function DEF(){ return {claimed:{}, meters:0, badges:{}, fogOn:false, started:Date.now(),
  pending:{claims:{},badges:{},week:false,streak:false},
  streak:{count:0,best:0,last:null,freezes:0}, week:{id:null,visits:{}}, day:{id:null,seen:{},newSegs:0}}; }
function normalize(){
  const d=DEF();
  ['claimed','badges'].forEach(k=>{ if(!S[k]) S[k]={}; });
  if(!S.pending||!S.pending.claims) S.pending=d.pending;
  if(!S.pending.badges) S.pending.badges={};
  if(!S.streak) S.streak=d.streak;
  if(!S.week||!S.week.visits) S.week=d.week;
  if(!S.day||!S.day.seen) S.day=d.day;
  rollDates();
}
function rollDates(){
  const t=dkey(), w=weekKey(t);
  if(S.week.id!==w){ S.week={id:w,visits:{}}; S.pending.week=false; }
  if(S.day.id!==t) S.day={id:t,seen:{},newSegs:0};
}
let S = DEF();
function loadLS(){
  try{ const raw=localStorage.getItem(LS_KEY); if(raw){ S=Object.assign(DEF(),JSON.parse(raw)); return true; } }catch(e){}
  return false;
}
let db=null;
const dbReady = new Promise(res=>{
  try{
    const rq=indexedDB.open('ralphies-roam',1);
    rq.onupgradeneeded=()=>{ const d=rq.result;
      if(!d.objectStoreNames.contains('kv')) d.createObjectStore('kv');
      if(!d.objectStoreNames.contains('track')) d.createObjectStore('track',{autoIncrement:true}); };
    rq.onsuccess=()=>{ db=rq.result; res(db); };
    rq.onerror=()=>res(null); rq.onblocked=()=>res(null);
  }catch(e){ res(null); }
});
function idb(store,mode,fn){
  return dbReady.then(d=>new Promise(res=>{
    if(!d) return res(null);
    try{ const tx=d.transaction(store,mode); const r=fn(tx.objectStore(store));
      tx.oncomplete=()=>res(r&&r.result); tx.onerror=tx.onabort=()=>res(null);
    }catch(e){ res(null); }
  }));
}
function saveNow(){
  try{ localStorage.setItem(LS_KEY, JSON.stringify(S)); }catch(e){}
  idb('kv','readwrite',st=>st.put(S,'state'));
}
let saveT=0;
function saveSoon(){ clearTimeout(saveT); saveT=setTimeout(saveNow,600); }
function logTrack(lat,lng,acc,src){ idb('track','readwrite',st=>st.add({t:Date.now(),lat,lng,acc:Math.round(acc),src})); }

/* =====================================================================
   DERIVED PROGRESS
   ===================================================================== */
function progress(){
  const z={}; ZONES.forEach(o=>z[o.id]={len:0,got:0,n:0,gotN:0});
  const tag={stairs:[0,0],bridge:[0,0],goat:[0,0]};
  let got=0, gotN=0, tagged=0;
  SEGS.forEach(s=>{
    const c=!!S.claimed[s.id], zz=z[s.zone]||(z[s.zone]={len:0,got:0,n:0,gotN:0});
    zz.len+=s.len; zz.n++; if(c){zz.got+=s.len; zz.gotN++; got+=s.len; gotN++;}
    s.tags.forEach(t=>{ if(tag[t]){ tag[t][1]++; if(c){tag[t][0]++; tagged++;} } });
  });
  const miles=S.meters/1609.344, nb=Object.keys(S.badges).length;
  const xp = gotN*10 + tagged*15 + nb*100 + Math.floor(S.meters/100)*5;
  const level = Math.floor(Math.sqrt(xp/150))+1;
  const cur=150*(level-1)*(level-1), next=150*level*level;
  return {z, tag, got, gotN, pct: TOTAL_LEN? got/TOTAL_LEN*100 : 0, miles, xp, level,
          lvlPct:(xp-cur)/(next-cur)*100, toNext:next-xp, nb, streak:streakNow(), best:S.streak.best,
          weekSegs:Object.keys(S.week.visits).length};
}

   BADGES
   ===================================================================== */

  {id:'first',   ic:'👣', name:'First Steps',       how:'Claim your first path segment', test:p=>p.gotN>=1},

function drawFog(){
  fogQueued=false;
  const size=map.getSize(), dpr=Math.min(window.devicePixelRatio||1,2);
  if(fog.width!==Math.round(size.x*dpr)||fog.height!==Math.round(size.y*dpr)){
    fog.width=Math.round(size.x*dpr); fog.height=Math.round(size.y*dpr);
    fog.style.width=size.x+'px'; fog.style.height=size.y+'px';
  }
  L.DomUtil.setPosition(fog, map.containerPointToLayerPoint([0,0]));
  const ctx=fog.getContext('2d');
  ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.globalCompositeOperation='source-over';
  ctx.clearRect(0,0,size.x,size.y);
  if(!S.fogOn) return;
  ctx.fillStyle='rgba(0,0,0,'+FOG_ALPHA+')';
  ctx.fillRect(0,0,size.x,size.y);
  ctx.globalCompositeOperation='destination-out';
  const mpp=156543.03392*Math.cos(map.getCenter().lat*Math.PI/180)/Math.pow(2,map.getZoom());
  const r=Math.max(9, REVEAL_M/mpp);
  const hole=(ll,rr)=>{
    const p=map.latLngToContainerPoint(ll);
    if(p.x<-rr||p.y<-rr||p.x>size.x+rr||p.y>size.y+rr) return;
    const g=ctx.createRadialGradient(p.x,p.y,rr*0.3,p.x,p.y,rr);
    g.addColorStop(0,'rgba(0,0,0,1)'); g.addColorStop(1,'rgba(0,0,0,0)');
    ctx.fillStyle=g; ctx.beginPath(); ctx.arc(p.x,p.y,rr,0,Math.PI*2); ctx.fill();
  };
  for(let i=0;i<SEGS.length;i++){ const s=SEGS[i]; if(S.claimed[s.id]){ hole(s.a,r); hole(s.mid,r); } }
  if(pos) hole([pos.lat,pos.lng], r*1.6);
}

/* =====================================================================
   POSITION PIPELINE — every GPS fix flows through onFix
   ===================================================================== */
let last=null; // last accepted fix {ll,t}
function claimAlong(points){
  const fresh=[]; let visited=0;
  for(const pt of points){
    const xy=toXY(pt[0],pt[1]);
    for(let i=0;i<SEGS.length;i++){
      const s=SEGS[i];
      if(Math.abs(xy[0]-s.cx)>s.rr||Math.abs(xy[1]-s.cy)>s.rr) continue;
      if(distToSeg(xy,s)>CLAIM_M) continue;
      if(!S.week.visits[s.id]){ S.week.visits[s.id]=1; S.pending.week=true; visited++; }
      if(!S.day.seen[s.id]){ S.day.seen[s.id]=1; visited++; }
      if(!S.claimed[s.id]){ S.claimed[s.id]=Date.now(); S.pending.claims[s.id]=S.claimed[s.id]; S.day.newSegs++; fresh.push(s); }
    }
  }
  return {fresh, visited};
}
function dayQualifies(){ return S.day.newSegs>0 || Object.keys(S.day.seen).length>=STREAK_SEGS; }
function streakNow(){
  const st=S.streak, t=dkey(); if(!st.last) return 0;
  if(st.last===t||st.last===addDays(t,-1)) return st.count;
  if(st.last===addDays(t,-2)&&st.freezes>0) return st.count;
  return 0;
}
function updateStreak(){
  const t=S.day.id, st=S.streak;
  if(st.last===t || !dayQualifies()) return false;
  if(st.last===addDays(t,-1)) st.count++;
  else if(st.last===addDays(t,-2) && st.freezes>0){ st.freezes--; st.count++; toast('🧊 Streak freeze used — your streak survives'); }
  else st.count=1;
  st.last=t; if(st.count>st.best) st.best=st.count;
  toast('🔥 '+(st.count===1?'Streak started — come back tomorrow for day 2':st.count+'-day streak!')); buzz([40,30,40]);
  if(st.count%7===0 && st.freezes<2){ st.freezes++; setTimeout(()=>toast('🧊 Earned a streak freeze (covers one missed day)'),900); }
  S.pending.streak=true;
  return true;
}
const zoneRemToast={};
function nearMissToasts(fresh){
  const zs={}; fresh.forEach(s=>zs[s.zone]=1);
  const p=progress();
  Object.keys(zs).forEach(z=>{
    const zz=p.z[z]; if(!zz) return; const rem=zz.n-zz.gotN, zn=(ZONES.find(x=>x.id===z)||{}).name||z;
    if(rem>0 && rem<=3 && zoneRemToast[z]!==rem){ zoneRemToast[z]=rem; setTimeout(()=>toast('🏁 '+rem+' segment'+(rem>1?'s':'')+' left to complete '+zn+'!'),700); buzz([20,40,20]); }
  });
}
function onFix(lat,lng,acc,src){
  pos={lat,lng,acc};
  showMe(lat,lng,acc);
  const good = acc<=ACC_MAX_M;
  if(src==='gps') setStatus(good?'ok':'warn', good?('Tracking · ±'+Math.round(acc)+' m'):('Weak GPS · ±'+Math.round(acc)+' m — waiting'));
  if(good){
    rollDates();
    const now=Date.now(), here=[lat,lng]; let pts=[here], moved=false;
    if(!last){ last={ll:here,t:now}; logTrack(lat,lng,acc,src); recPoint(lat,lng); }
    else{
      const d=distM(last.ll,here), dt=(now-last.t)/1000;
      if(d>=Math.max(4,acc*0.5)){
        const plausible = dt<=90 && d/Math.max(dt,0.5)<=MAX_SPEED;
        if(plausible){
          S.meters+=d; if(S.rec){ S.rec.meters+=d; if(d/Math.max(dt,0.5)>=0.3) S.rec.moving=(S.rec.moving||0)+Math.min(dt,30); } moved=true;
          const n=Math.min(40,Math.floor(d/6)); // fill the gap between fixes so nothing is skipped
          for(let k=1;k<n;k++) pts.push([last.ll[0]+(lat-last.ll[0])*k/n, last.ll[1]+(lng-last.ll[1])*k/n]);
        }
        last={ll:here,t:now}; logTrack(lat,lng,acc,src); recPoint(lat,lng);
      }
    }
    const r=claimAlong(pts), fresh=r.fresh; if(S.rec)S.rec.newSegments+=fresh.length;
    const streakUp=updateStreak();
    if(fresh.length){ fresh.forEach(markClaimed); onFreshClaims(fresh); buzz(30); }
    else renderRecBar();
    if(fresh.length||moved||r.visited||streakUp){ checkBadges(fresh.length>0); saveSoon(); render(); syncSoon(); }
  }
  queueFog();
}

/* =====================================================================
   REAL GPS — navigator.geolocation.watchPosition
   ===================================================================== */
let watchId=null, wakeLock=null;
const GEO_OPTS={enableHighAccuracy:true, maximumAge:1000, timeout:10000};
function startGPS(){
  if(!('geolocation' in navigator)) return gpsProblem('This browser has no location support.','Try Safari on iPhone or Chrome on Android.');
  if(!window.isSecureContext) return gpsProblem('GPS needs a secure (https) page.','Open this app from its https:// address.');
  if(watchId!==null)return;
  if(!S.rec) S.rec={at:Date.now(),meters:0,newSegments:0,moving:0,newPaths:0,pts:[],seen:{}}; saveNow(); go('explore');
  setStatus('warn','Finding GPS…');
  watchId=navigator.geolocation.watchPosition(
    p=>onFix(p.coords.latitude,p.coords.longitude,p.coords.accuracy||999,'gps'),
    err=>{
      if(err.code===1){ stopGPS(); gpsProblem('Location permission was denied.','To use real GPS, allow location for this site (iPhone: Settings → Privacy & Security → Location Services → Safari Websites → While Using; then reload). On Android: tap the lock icon by the address → Permissions → Location → Allow.'); }
      else if(err.code===2) setStatus('bad','GPS unavailable — still trying');
      else setStatus('warn','GPS timeout — still trying');
    }, GEO_OPTS);
  follow=true; $('fabFollow').classList.add('on');
  lockScreen(); setTrackUI(true);
}
function stopGPS(){
  if(watchId!==null){ navigator.geolocation.clearWatch(watchId); watchId=null; }
  if(wakeLock){ try{wakeLock.release();}catch(e){} wakeLock=null; }
  last=null; setTrackUI(false); setStatus('', 'GPS off'); finishRecording(); saveNow();
}
function lockScreen(){ // keep the screen awake so the browser keeps delivering GPS fixes
  if('wakeLock' in navigator) navigator.wakeLock.request('screen').then(w=>{wakeLock=w;}).catch(()=>{});
}
document.addEventListener('visibilitychange',()=>{
  if(document.visibilityState==='hidden'){ saveNow(); flush(); }

});

/* =====================================================================
   NEAR-MISS NUDGES — the single most useful next thing to do
   ===================================================================== */
let NUDGES=[], pingMarker=null;
const COMPASS=['N','NE','E','SE','S','SW','W','NW'];
function bearing(a,b){ const p=toXY(a[0],a[1]), q=toXY(b[0],b[1]); return COMPASS[Math.round(((Math.atan2(q[0]-p[0],q[1]-p[1])*180/Math.PI)+360)%360/45)%8]; }
function fmtD(m){ return m<160 ? Math.max(10,Math.round(m*3.28084/10)*10)+' ft' : (m/1609.344).toFixed(m<1600?2:1)+' mi'; }
function nearest(filter){
  const from = pos ? [pos.lat,pos.lng] : [map.getCenter().lat,map.getCenter().lng];
  const xy=toXY(from[0],from[1]); let best=null, bd=Infinity;
  for(let i=0;i<SEGS.length;i++){ const s=SEGS[i]; if(!filter(s)) continue; const d=distToSeg(xy,s); if(d<bd){bd=d;best=s;} }
  return best ? {s:best, d:bd, dir:bearing(from,best.mid), here:!!pos} : null;
}
function where(n){ return n ? (n.here ? ' · '+fmtD(n.d)+' '+n.dir : '') : ''; }
function zoneName(id){ return (ZONES.find(z=>z.id===id)||{name:id}).name; }
function buildNudges(p){
  const out=[], t=dkey();
  const add=(score,text,n,tab)=>out.push({score,text,target:n&&n.s?n.s.mid:null,tab});
  // streak
  const sNow=p.streak, todayDone=S.streak.last===t;
  if(!todayDone){
    const need=STREAK_SEGS-Math.min(Object.keys(S.day.seen).length,STREAK_SEGS);
    const late=new Date().getHours()>=15;
    if(sNow>0) add(30,'Walk today to keep your '+sNow+'-day streak — rest days are fine',nearest(s=>!S.claimed[s.id]));
  }
  // zones close to complete
  ZONES.forEach(z=>{ const zz=p.z[z.id]; if(!zz||!zz.n) return; const rem=zz.n-zz.gotN;
    if(rem>0 && rem<=Math.max(3,Math.ceil(zz.n*0.08))) add(90-rem,'Almost done with '+z.name+' — '+rem+' short section'+(rem>1?'s':'')+' left',nearest(s=>s.zone===z.id&&!S.claimed[s.id]));
  });
  // territory
  if(typeof cloud!=='undefined' && cloud.territory && cloud.profile && cloud.profile.dorm){
    const my=cloud.profile.dorm;
    ZONES.forEach(z=>{
      const rows=cloud.territory.filter(r=>r.zone===z.id); if(!rows.length) return;
      const lead=rows[0], mine=rows.find(r=>r.is_my_dorm);
      const tgt=nearest(s=>s.zone===z.id&&!S.week.visits[s.id]);
      if(mine && mine.rank>1){ const gap=lead.points-mine.points+1; if(gap<=20) add(88-gap,'⚔️ '+gap+' pts to take '+z.name+' from '+lead.dorm+where(tgt),tgt); }
      else if(mine && mine.rank===1 && rows[1]){ const gap=mine.points-rows[1].points; if(gap<=5) add(80-gap,'🛡️ Defend '+z.name+': '+rows[1].dorm+' is '+gap+' behind'+where(tgt),tgt); }
      else if(!mine && rows.length && lead.points<=10) add(55,'🚩 '+z.name+' is up for grabs — '+lead.dorm+' has only '+lead.points+where(tgt),tgt);
    });
  }
  // weekly leaderboard
  if(typeof cloud!=='undefined' && cloud.weekBoard){
    const me=cloud.weekBoard.find(r=>r.is_me);
    if(me && me.rank>1){ const above=cloud.weekBoard.filter(r=>r.rank<me.rank).pop();
      if(above){ const gap=Number(above.segments)-Number(me.segments)+1; if(gap<=25) add(76-gap,gap+' more path section'+(gap>1?'s':'')+' to pass '+above.name+' this week',nearest(s=>!S.week.visits[s.id])); } }
  }
  // badge sets
  [['stairs','🪜','staircase','stairsA','Stair Master'],['bridge','🌉','bridge','bridgeA','Troll Toll'],['goat','🐐','goat path','goatA','Off-Trail Legend']].forEach(b=>{
    const tg=p.tag[b[0]], rem=tg[1]-tg[0];
    if(!S.badges[b[3]] && rem>0 && rem<=3){ const n=nearest(s=>!S.claimed[s.id]&&s.tags.indexOf(b[0])>=0); add(62-rem,b[1]+' '+rem+' '+b[2]+(rem>1?'s':'')+' left for '+b[4]+where(n),n); }
  });
  // something special nearby
  if(pos){
    const st=nearest(s=>!S.claimed[s.id]&&s.tags.length>0);
    if(st && st.d<220) add(70-st.d/10,(st.s.tags[0]==='stairs'?'🪜 Unclaimed stairs':st.s.tags[0]==='bridge'?'🌉 Unclaimed bridge':'🐐 Unclaimed goat path')+where(st),st);
  }
  // miles
  [[1,'First Mile'],[5,'Five-Miler'],[13.1,'Half Marathon']].forEach(m=>{ const r=m[0]-p.miles; if(r>0&&r<=0.25) add(50,'🥾 '+r.toFixed(2)+' mi to '+m[1]); });
  // fallback
  const n=nearest(s=>!S.claimed[s.id]);
  if(n) add(10,'🧭 Nearest new path: '+nameOf(n.s)+where(n),n);
  // naming rights
  if(typeof cloud!=='undefined' && cloud.user && pos){
    const nm=nearest(s=>S.claimed[s.id] && canBeNamed(s.pid) && !NAMES[s.pid]);
    if(nm && nm.d<120){ out.push({score:48, text:'✏️ Name the path you walked — it\'ll show on everyone\'s map', target:nm.s.mid, seg:nm.s}); }
  }
  return out.sort((a,b)=>b.score-a.score);
}

function canBeNamed(pid){ const p=PATH_BY_ID[pid]; return !!p && /^w\d{1,15}$/.test(p.id) && !p.official; }
const NF={
  roots:['fuck','shit','cunt','nigg','fagg','bitch','whore','slut','porn','retard','kike','hitler','twat','wank','jizz','dildo','penis','vagina','pussy','rapist','motherf','cocksuck','dickhead','asshole','titties','nazi','blowjob','handjob','clit'],
  stretch:['fuck','shit','cunt','bitch','whore','slut','porn','twat','wank','dildo','penis','vagina','rapist','retard','kike','hitler','clit'],
  words:['ass','arse','asses','cock','cocks','dick','dicks','tit','tits','boob','boobs','piss','sex','sexy','fag','fags','rape','raped','heil','kkk','spic','chink','dyke','hoe','hoes','coon','gook','wop','tranny','balls','nut','nuts','crap']
};
function nameProblem(raw){
  const p=String(raw||'').replace(/\s+/g,' ').trim();
  if(p.length<3||p.length>30) return 'Names must be 3–30 characters';
  if(!/^[A-Za-z0-9 '’&.,!?()#-]+$/.test(p)) return 'Use letters, numbers, spaces and basic punctuation';
  if(/(https?|www\.|\.(com|net|org|io|gg|edu|ly)\b)/i.test(p)) return 'No links, please';
  if(/[0-9]{6,}/.test(p)) return 'No phone numbers or long codes';
  const tr={'0':'o','1':'i','3':'e','4':'a','5':'s','7':'t','!':'i','8':'b'};
  const n=p.toLowerCase().replace(/[0134578!]/g,c=>tr[c]);
  const sq=n.replace(/[^a-z]/g,''), col=sq.replace(/(.)\1+/g,'$1');
  if(NF.roots.some(r=>sq.indexOf(r)>=0) || NF.stretch.some(r=>col.indexOf(r)>=0)) return 'Please keep names clean';
  if(n.replace(/[^a-z]+/g,' ').trim().split(' ').some(t=>NF.words.indexOf(t)>=0||NF.words.indexOf(t.replace(/(.)\1+/g,'$1'))>=0)) return 'Please keep names clean';
  return null;
}
const labelLayer=L.layerGroup();
function drawNameLabels(){
  labelLayer.clearLayers();
  Object.keys(NAMES).forEach(pid=>{
    const p=PATH_BY_ID[pid]; if(!p||!p.pts||p.pts.length<2) return;
    let tot=0; const d=[]; for(let i=1;i<p.pts.length;i++){ const x=distM(p.pts[i-1],p.pts[i]); d.push(x); tot+=x; }
    let acc=0, mid=p.pts[0];
    for(let i=0;i<d.length;i++){ if(acc+d[i]>=tot/2){ const t=(tot/2-acc)/(d[i]||1); mid=[p.pts[i][0]+(p.pts[i+1][0]-p.pts[i][0])*t, p.pts[i][1]+(p.pts[i+1][1]-p.pts[i][1])*t]; break; } acc+=d[i]; }
    L.tooltip({permanent:true, direction:'center', className:'pname', interactive:false, opacity:1}).setLatLng(mid).setContent(esc(NAMES[pid].name)).addTo(labelLayer);
  });
  toggleLabels();
}
function toggleLabels(){ const on=map.getZoom()>=17; if(on&&!map.hasLayer(labelLayer)) labelLayer.addTo(map); if(!on&&map.hasLayer(labelLayer)) map.removeLayer(labelLayer); }
map.on('zoomend',toggleLabels);
async function loadNames(){
  if(!cloud.sb) return;
  const {data,error}=await cloud.sb.rpc('get_path_names');
  if(error||!data) return;
  const m={}; data.forEach(r=>{ m[r.path_id]={name:r.name, by:r.named_by_name, mine:!!r.is_mine}; });
  NAMES=m; try{ localStorage.setItem('rr-names',JSON.stringify(m)); }catch(e){}
  drawNameLabels(); render(); if(checkBadges(false)) saveSoon();
}
let pathHL=null;
function pathAt(latlng){
  const xy=toXY(latlng.lat,latlng.lng);
  const mpp=156543.03392*Math.cos(latlng.lat*Math.PI/180)/Math.pow(2,map.getZoom());
  const tol=Math.max(8, 22*mpp); let best=null, bd=tol;
  for(let i=0;i<SEGS.length;i++){ const s=SEGS[i]; if(Math.abs(xy[0]-s.cx)>s.rr+tol||Math.abs(xy[1]-s.cy)>s.rr+tol) continue; const d=distToSeg(xy,s); if(d<bd){ bd=d; best=s; } }
  return best;
}
function openPath(seg){
  const p=PATH_BY_ID[seg.pid]; if(!p) return;
  const segs=SEGS.filter(s=>s.pid===p.id), got=segs.filter(s=>S.claimed[s.id]).length;
  const len=segs.reduce((a,s)=>a+s.len,0), n=NAMES[p.id];
  if(pathHL) map.removeLayer(pathHL);
  pathHL=L.polyline(p.pts,{color:'#096FAE',weight:8,opacity:.85,interactive:false,renderer:pathRenderer}).addTo(map);
  const clearHL=()=>{ if(pathHL){ map.removeLayer(pathHL); pathHL=null; } };
  const title = n ? n.name : (p.official ? p.name : 'Unnamed '+p.name.toLowerCase());
  const tagTxt = p.tags&&p.tags.length ? ' · '+p.tags.map(t=>t==='stairs'?'🪜 stairs':t==='bridge'?'🌉 bridge':'🐐 goat path').join(', ') : '';
  let meta = (n ? 'Named by '+esc(n.by)+(n.mine?' (you)':'') : p.official ? 'Official name' : 'No name yet')+
             ' · '+ft(len)+' ft · '+got+'/'+segs.length+' claimed'+tagTxt;
  const canName = canBeNamed(p.id);
  const close=['Close','',()=>{}];
  if(!canName){
    return modal(title,'<p class="pmeta">'+meta+'</p><p>This path already has an official name.</p>',[close],clearHL);
  }
  if(!cloud.sb) return modal(title,'<p class="pmeta">'+meta+'</p><p>Path naming turns on once cloud sync is set up.</p>',[close],clearHL);
  if(!cloud.user) return modal(title,'<p class="pmeta">'+meta+'</p><p>Walk a path, then sign in to give it a name everyone will see.</p>',
    [['Sign in','pri',goSignIn],close],clearHL);
  if(n && !n.mine) return modal(title,'<p class="pmeta">'+meta+'</p><p>Already named — the first walker to name a path keeps it.</p>',[close],clearHL);
  if(!got) return modal(title,'<p class="pmeta">'+meta+'</p><p>Walk any part of this path to earn naming rights.</p>',[close],clearHL);
  modal(n?'Rename this path':'Name this path',
    '<p class="pmeta">'+meta+'</p>'+
    '<label class="f" for="pnName">Path name</label><input class="field" id="pnName" maxlength="30" autocomplete="off" placeholder="e.g. Ralphie\'s Shortcut" value="'+esc(n?n.name:'')+'">'+
    '<div class="pmsg" id="pnMsg"></div>'+
    '<p class="note" style="margin-top:6px">Everyone sees this name, signed in or not. Keep it clean — names with profanity are rejected.</p>',
    [[n?'Save new name':'Name it','pri',()=>saveName(p.id,$('pnName').value),'pnSave']]
      .concat(n?[['Remove my name','danger',()=>saveName(p.id,'')]]:[]).concat([close]), clearHL);
  const inp=$('pnName'), msg=$('pnMsg'), btn=$('pnSave');
  const check=()=>{ const v=inp.value, pr=v.trim()?nameProblem(v):'Type a name';
    btn.disabled=!!pr || (n && v.trim()===n.name); msg.className='pmsg'+(pr&&v.trim()?' bad':(!pr?' good':''));
    msg.textContent = v.trim() ? (pr||'Looks good') : ''; };
  inp.addEventListener('input',check); inp.addEventListener('keydown',e=>{ if(e.key==='Enter'&&!btn.disabled) btn.click(); });
  check(); setTimeout(()=>inp.focus(),50);
}
async function saveName(pid,name){
  name=String(name||'').replace(/\s+/g,' ').trim();
  if(name && nameProblem(name)) return toast(nameProblem(name));
  await flush();   // the server checks you've walked it, so send claims first
  const {error}=await cloud.sb.rpc('set_path_name',{p_path:pid, p_name:name});
  if(error) return toast('Couldn\'t save: '+error.message);
  if(name){ NAMES[pid]={name, by:(cloud.profile&&cloud.profile.display_name)||'you', mine:true}; toast('✏️ Named “'+name+'” — it\'s on everyone\'s map'); buzz([30,30,60]); }
  else { delete NAMES[pid]; toast('Name removed'); }
  drawNameLabels(); render(); if(checkBadges(false)) saveSoon();
  loadNames();
}

const CFG = window.RR_CONFIG || {};
const cloud = {sb:null, user:null, syncing:false, lastSync:0, err:'', step:'email', email:'', board:'week', hazards:[],
               profile:null, territory:null, weekBoard:null, terrAt:0};
let DORM_LIST=[];
try{
  if(CFG.supabaseUrl && CFG.supabaseKey && window.supabase)
    cloud.sb = window.supabase.createClient(CFG.supabaseUrl, CFG.supabaseKey,
      {auth:{persistSession:true, autoRefreshToken:true, detectSessionInUrl:true, flowType:'implicit'}});
}catch(e){ cloud.sb=null; }

const HZ = {dark:'Dark area', lighting:'Broken light', ice:'Ice or snow', trip:'Trip hazard', other:'Other'};

function setSync(err, ok){
  cloud.err=err||''; if(ok) cloud.lastSync=Date.now();
  const el=$('syncLine'); if(!el) return;
  el.className='sync'+(cloud.err?' err':'');
  const pend=Object.keys(S.pending.claims).length+Object.keys(S.pending.badges).length;
  el.textContent = cloud.err ? ('Sync problem: '+cloud.err)
    : cloud.syncing ? 'Syncing…'
    : pend ? (pend+' change'+(pend>1?'s':'')+' waiting to sync')
    : cloud.lastSync ? ('Synced '+new Date(cloud.lastSync).toLocaleTimeString([], {hour:'numeric',minute:'2-digit'}))
    : 'Ready';
}
let syncT=0;
function syncSoon(){ if(!cloud.user) return; clearTimeout(syncT); syncT=setTimeout(flush,4000); setSync(cloud.err); }
async function flush(){
  if(!cloud.sb||!cloud.user||cloud.syncing||!navigator.onLine) return;
  cloud.syncing=true; setSync('');
  try{
    const cids=Object.keys(S.pending.claims);
    if(cids.length){
      const {error}=await cloud.sb.from('claims').upsert(
        cids.map(id=>({segment_id:id, claimed_at:new Date(S.pending.claims[id]).toISOString()})),
        {onConflict:'user_id,segment_id', ignoreDuplicates:true});
      if(error) throw error;
      cids.forEach(id=>delete S.pending.claims[id]);
    }
    const bids=Object.keys(S.pending.badges);
    if(bids.length){
      const {error}=await cloud.sb.from('user_badges').upsert(
        bids.map(id=>({badge_id:id, unlocked_at:new Date(S.pending.badges[id]).toISOString()})),
        {onConflict:'user_id,badge_id', ignoreDuplicates:true});
      if(error) throw error;
      bids.forEach(id=>delete S.pending.badges[id]);
    }
    const {error}=await cloud.sb.rpc('set_meters',{p_meters:S.meters});
    if(error) throw error;
    let weekChanged=false;
    if(S.pending.week){
      const r=await cloud.sb.rpc('set_week_points',{p_week:S.week.id, p_points:weekPoints()});
      if(r.error && !/this week or last week/i.test(r.error.message)) throw r.error;
      S.pending.week=false; weekChanged=true;
    }
    if(S.pending.streak && S.streak.last){
      const r=await cloud.sb.rpc('set_streak',{p_streak:S.streak.count, p_best:S.streak.best, p_last:S.streak.last});
      if(r.error && !/invalid streak date/i.test(r.error.message)) throw r.error;
      S.pending.streak=false;
    }
    cloud.syncing=false; saveSoon(); setSync('',true);
    if(weekChanged && Date.now()-cloud.terrAt>30000) loadTerritory();
  }catch(e){ cloud.syncing=false; setSync(e.message||String(e)); }
}
async function pull(){
  try{
    const [c,b,st]=await Promise.all([
      cloud.sb.from('claims').select('segment_id,claimed_at').limit(5000),
      cloud.sb.from('user_badges').select('badge_id,unlocked_at'),
      cloud.sb.from('user_stats').select('meters,streak,best_streak,streak_last').maybeSingle()]);
    const err=c.error||b.error||st.error; if(err) throw err;
    const srvC={}, srvB={};
    c.data.forEach(r=>{ srvC[r.segment_id]=1; if(!S.claimed[r.segment_id]) S.claimed[r.segment_id]=Date.parse(r.claimed_at)||Date.now(); });
    b.data.forEach(r=>{ srvB[r.badge_id]=1; if(!S.badges[r.badge_id]) S.badges[r.badge_id]=Date.parse(r.unlocked_at)||Date.now(); });
    Object.keys(S.claimed).forEach(id=>{ if(!srvC[id]) S.pending.claims[id]=S.claimed[id]; });
    Object.keys(S.badges).forEach(id=>{ if(!srvB[id]) S.pending.badges[id]=S.badges[id]; });
    if(st.data && st.data.meters>S.meters) S.meters=st.data.meters;
    if(st.data && st.data.streak_last && (!S.streak.last || st.data.streak_last>S.streak.last)){
      S.streak.count=st.data.streak; S.streak.last=st.data.streak_last; }
    if(st.data && st.data.best_streak>S.streak.best) S.streak.best=st.data.best_streak;
    if(S.streak.last && (!st.data || !st.data.streak_last || S.streak.last>st.data.streak_last)) S.pending.streak=true;
    if(Object.keys(S.week.visits).length) S.pending.week=true;
    saveNow(); drawPaths(); render(); queueFog();
    await flush();
  }catch(e){ setSync(e.message||String(e)); }
}

function pathMid(p){
  let tot=0; const d=[]; for(let i=1;i<p.pts.length;i++){ const x=distM(p.pts[i-1],p.pts[i]); d.push(x); tot+=x; }
  let acc=0; for(let i=0;i<d.length;i++){ if(acc+d[i]>=tot/2){ const t=(tot/2-acc)/(d[i]||1); return [p.pts[i][0]+(p.pts[i+1][0]-p.pts[i][0])*t, p.pts[i][1]+(p.pts[i+1][1]-p.pts[i][1])*t]; } acc+=d[i]; }

}

function shapeSVG(shape,stroke){
  const ky=111320, kx=111320*Math.cos(40*Math.PI/180);
  const xs=shape.map(p=>p[1]*kx), ys=shape.map(p=>-p[0]*ky);
  const minx=Math.min(...xs), maxx=Math.max(...xs), miny=Math.min(...ys), maxy=Math.max(...ys);
  const w=Math.max(maxx-minx,1), h=Math.max(maxy-miny,1), s=90/Math.max(w,h), ox=(100-w*s)/2, oy=(100-h*s)/2;
  const pts=shape.map((p,i)=>((xs[i]-minx)*s+ox).toFixed(1)+','+((ys[i]-miny)*s+oy).toFixed(1)).join(' ');
  return '<svg viewBox="0 0 100 100" preserveAspectRatio="xMidYMid meet" aria-hidden="true"><polyline points="'+pts+'" fill="none" stroke="'+(stroke||'currentColor')+'" stroke-width="'+(stroke?3.5:4)+'" stroke-linecap="round" stroke-linejoin="round"/></svg>';
}

function clock(sec){ sec=Math.max(0,Math.floor(sec)); const h=Math.floor(sec/3600), m=Math.floor(sec%3600/60), s=sec%60; return (h?h+':'+String(m).padStart(2,'0'):m)+':'+String(s).padStart(2,'0'); }

/* ---------- one useful next action, derived from real data ---------- */
let NEXT=null;
function nextAction(p,h,a,rows){
  const need=id=>rows.find(r=>r.id===id&&!r.done);
  if(need('paths')){ const n=nearest(s=>!(h.paths[s.pid]&&h.paths[s.pid].visited)); if(n) return {ic:'route',title:'Visit a new path',sub:cap(pathTitle(n.s.pid))+where(n),target:n.s.mid}; }
  if(need('zone')){ const n=nearest(s=>s.zone!=='campus'&&!h.zones[s.zone]); if(n) return {ic:'pin',title:'Explore '+zoneName(n.s.zone),sub:'A zone you haven’t walked yet'+where(n),target:n.s.mid}; }
  if(need('complete')){
    let best=null; Object.keys(h.paths).forEach(pid=>{ const x=h.paths[pid]; if(!x.complete&&x.total>1&&(!best||x.got/x.total>best.r)) best={pid,r:x.got/x.total}; });
    if(best){ const n=nearest(s=>s.pid===best.pid&&!S.claimed[s.id]); const left=(PATH_SEGS[best.pid]||[]).filter(id=>!S.claimed[id]).reduce((m,id)=>m+(SEG_BY_ID[id]?SEG_BY_ID[id].len:0),0);
      if(n) return {ic:'check',title:'Finish '+pathTitle(best.pid),sub:'About '+fmtD(left)+' left'+where(n),target:n.s.mid}; }
  }
  if(cloud.user&&cloud.profile&&cloud.profile.dorm&&cloud.territory){
    let best=null; ZONES.forEach(z=>{ const rows2=cloud.territory.filter(r=>r.zone===z.id); const mine=rows2.find(r=>r.is_my_dorm);
      if(rows2.length&&mine&&Number(mine.rank)>1){ const gap=rows2[0].points-mine.points+1; if(gap<=15&&(!best||gap<best.gap)) best={z,gap,lead:rows2[0].dorm}; } });
    if(best){ const n=nearest(s=>s.zone===best.z.id&&!S.week.visits[s.id]); return {ic:'flag',title:'Help '+cloud.profile.dorm+' lead '+best.z.name,sub:best.gap+' more points passes '+best.lead+where(n),target:n?n.s.mid:null,go:n?null:'community'}; }
  }
  if(need('walks')&&!S.rec){ const r=need('walks'); return {ic:'walk',title:'Record a walk',sub:r.value+' of '+r.target+' walks this week',record:true}; }
  if(rows.length&&rows.every(r=>r.done)) return {ic:'check',title:'This week’s goals are done',sub:'Nice work. Wander more or take a rest — both count.',none:true};
  const n=nearest(s=>!S.claimed[s.id]); if(n) return {ic:'route',title:'Walk somewhere new',sub:cap(pathTitle(n.s.pid))+where(n),target:n.s.mid};
  return null;
}
const cap=t=>t.charAt(0).toUpperCase()+t.slice(1);
function nextHTML(n){ NEXT=n; return '<button class="next" data-act="next"><span class="ic">'+icon(n.ic,'sm')+'</span><span class="grow"><b>'+esc(n.title)+'</b><small>'+esc(n.sub||'')+'</small></span>'+(n.none?'':icon('chev','sm'))+'</button>'; }
function doNext(n){
  if(!n||n.none) return;
  if(n.record) return startRecordingFlow();
  if(n.go) return go(n.go);
  if(n.target) flyTo(n.target);
}
function flyTo(target){
  if(VIEW!=='explore') go('explore');
  follow=false; $('fabFollow').classList.remove('on'); setSheet(false);
  setTimeout(()=>{ map.invalidateSize(); if(REDUCED.matches) map.setView(target,18); else map.flyTo(target,18,{duration:.7});
    if(pingMarker) map.removeLayer(pingMarker);
    pingMarker=L.marker(target,{icon:L.divIcon({className:'',html:'<div class="ping"></div>',iconSize:[28,28],iconAnchor:[14,14]}),interactive:false,keyboard:false}).addTo(map);
    setTimeout(()=>{ if(pingMarker){ map.removeLayer(pingMarker); pingMarker=null; } },6000); },80);

function teamSummary(){

function recPoint(lat,lng){

function pathVisitAt(pid){   // when this path first counted as visited (same rule as the goals), or null
  const ids=(PATH_SEGS[pid]||[]).filter(id=>S.claimed[id]).sort((a,b)=>S.claimed[a]-S.claimed[b]);
  const need=Math.min(RoamStudent.VISIT_M,(PATH_LEN[pid]||0)/2); let acc=0;
  for(const id of ids){ acc+=SEG_BY_ID[id]?SEG_BY_ID[id].len:0; if(acc>=need-1e-6) return S.claimed[id]; }
  return null;
}
function pathDone(pid){ return (PATH_SEGS[pid]||[]).every(id=>S.claimed[id]); }
function onFreshClaims(fresh){
  const pids={}; fresh.forEach(s=>pids[s.pid]=1);
  Object.keys(pids).forEach(pid=>{
    const since=S.rec?S.rec.at:Date.now()-60000, va=pathVisitAt(pid);
    if(va!=null && va>=since && !(S.rec&&S.rec.seen&&S.rec.seen[pid])){ if(S.rec){ (S.rec.seen=S.rec.seen||{})[pid]=1; S.rec.newPaths=(S.rec.newPaths||0)+1; } toast('New path · '+cap(pathTitle(pid))); }
    if(pathDone(pid)){ toast('Path completed · '+cap(pathTitle(pid))); drawHoofs(); }
  });
  renderRecBar();
}

function finishRecording(){
  const r=S.rec; if(!r) return; S.rec=null;
  const end=Date.now(), h=hist();
  let newPaths=0, completedPaths=0;
  Object.keys(h.paths).forEach(pid=>{ const x=h.paths[pid]; if(x.visited&&x.visitedAt>=r.at) newPaths++; if(x.complete&&x.last>=r.at) completedPaths++; });
  const shape=RoamStudent.trimRoute(r.pts||[]);
  const s=RoamStudent.session(r.at,end,r.meters,r.newSegments,{moving:r.moving,newPaths,completedPaths,shape});
  if(s.meters<1&&!s.newSegments){ saveNow(); render(); toast('Walk not saved — no movement was recorded'); return; }
  // what changed because of this walk: compare goals before and after it
  const p=progress(), before={}; Object.keys(S.claimed).forEach(id=>{ if(S.claimed[id]<r.at) before[id]=S.claimed[id]; });
  const hb=RoamStudent.pathHistory(before,SEG_META,PATH_SEGN,PATH_LEN), ws=weekStartMs();
  const rowsB=RoamStudent.goalRows(S.goals,RoamStudent.activitySince(hb,S.sessions||[],ws,{skipZones:['campus']}),zonesLeft(hb,p));
  const sessionsA=[s].concat(S.sessions||[]);
  const rowsA=RoamStudent.goalRows(S.goals,RoamStudent.activitySince(h,sessionsA,ws,{skipZones:['campus']}),zonesLeft(h,p));
  const earned=BADGES.filter(b=>S.badges[b.id]&&S.badges[b.id]>=r.at);
  const reached=rowsA.find(a=>a.done&&!(rowsB.find(b=>b.id===a.id)||{}).done);
  const pending=rowsA.find(a=>!a.done);
  s.accomp = reached ? 'Weekly goal reached: '+reached.label.toLowerCase()
           : earned.length ? 'Badge earned: '+earned[0].name
           : pending ? 'Next: '+pending.label.toLowerCase()+' — '+pending.value+' of '+pending.target+' this week'
           : 'All of this week’s goals are done.';
  S.sessions=sessionsA.slice(0,50); saveNow(); render();
  showFinish(s,true);
}

async function shareWalk(s,withShape){
  const W=1080,H=1350,c=document.createElement('canvas'); c.width=W; c.height=H; const g=c.getContext('2d');
  const F='"Helvetica Neue",Helvetica,Arial,sans-serif';
  g.fillStyle='#1E2022'; g.fillRect(0,0,W,H);
  g.save(); g.translate(84,78); g.scale(4.2,4.2); g.fillStyle='#CFB87C'; HOOF_D.forEach(d=>g.fill(new Path2D(d))); g.restore();
  g.fillStyle='#fff'; g.font='700 60px '+F; g.fillText('BuffPrints',200,152);
  g.fillStyle='#CFB87C'; g.font='600 34px '+F; g.fillText(new Date(s.at).toLocaleDateString('en-US',{month:'long',day:'numeric',year:'numeric'}),84,256);
  let y=320;
  if(withShape&&s.shape){
    const ky=111320,kx=111320*Math.cos(40*Math.PI/180), xs=s.shape.map(p=>p[1]*kx), ys=s.shape.map(p=>-p[0]*ky);
    const minx=Math.min(...xs),maxx=Math.max(...xs),miny=Math.min(...ys),maxy=Math.max(...ys), bw=912,bh=440;
    const sc=Math.min(bw/Math.max(maxx-minx,1),bh/Math.max(maxy-miny,1))*0.9, ox=84+(bw-(maxx-minx)*sc)/2, oy=y+(bh-(maxy-miny)*sc)/2;
    g.strokeStyle='#CFB87C'; g.lineWidth=12; g.lineCap='round'; g.lineJoin='round'; g.beginPath();
    xs.forEach((x,i)=>{ const px=ox+(x-minx)*sc, py=oy+(ys[i]-miny)*sc; i?g.lineTo(px,py):g.moveTo(px,py); }); g.stroke();
    y+=bh+60;
  }else y+=40;
  const lines=RoamStudent.shareLines(s);
  lines.forEach((l,i)=>{ const col=i%2, row=Math.floor(i/2), x=84+col*470, yy=y+row*175;
    g.fillStyle='#fff'; g.font='700 92px '+F; g.fillText(l.v,x,yy+92);
    g.fillStyle='#C9C5BC'; g.font='500 32px '+F; g.fillText(l.k,x,yy+142); });
  g.fillStyle='#CFB87C'; g.font='600 32px '+F; g.fillText('Explore campus. Leave your mark.',84,H-70);
  const blob=await new Promise(r=>c.toBlob(r,'image/png')); if(!blob) return toast('Couldn’t create the image');
  const file=typeof File==='function'?new File([blob],'buffprints-walk.png',{type:'image/png'}):null;
  if(file&&navigator.canShare&&navigator.canShare({files:[file]})){
    try{ await navigator.share({files:[file],title:'BuffPrints walk'}); return; }catch(e){ if(e&&e.name==='AbortError') return; }
  }
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='buffprints-walk-'+String(s.at).slice(0,10)+'.png';
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(a.href),5000); toast('Summary image downloaded');
}

let focusBeforeModal=null;
new MutationObserver(()=>{
  if($('modal').classList.contains('show')){
    if(!$('modal').contains(document.activeElement)) focusBeforeModal=document.activeElement;
    const first=$('modal').querySelector('input,select,textarea,button,a[href]'); if(first) first.focus();

}).observe($('modal'),{attributes:true,attributeFilter:['class']});
document.addEventListener('keydown',e=>{
  const open=$('modal').classList.contains('show')?$('modal'):$('finish').classList.contains('show')?$('finish'):null;
  if(!open) return;
  if(e.key==='Escape'){ if(open===$('finish')) closeFinish(); else { $('modal').classList.remove('show'); if(modalClose){ modalClose(); modalClose=null; } } }
  if(e.key==='Tab'){
    const items=[...open.querySelectorAll('button:not([disabled]),input,textarea,select,a[href]')].filter(x=>x.offsetParent!==null), first=items[0], last=items[items.length-1];
    if(!first) return;

  }
});
$('modal').addEventListener('click',e=>{ if(e.target===$('modal')){ $('modal').classList.remove('show'); if(modalClose){ modalClose(); modalClose=null; } } });

/* ---- auth state ---- */
if(cloud.sb){
  cloud.sb.auth.onAuthStateChange((event,session)=>{
    const u=session?session.user:null;
    if((u&&u.id)===(cloud.user&&cloud.user.id)) return;
    cloud.user=u; if(!u){ cloud.step='email'; cloud.lastSync=0; cloud.err=''; }
    setTimeout(()=>{ buildCloudBox(); render(); if(u){ pull().then(loadTerritory); loadProfile(); loadHazards(); loadNames(); toast('Signed in — syncing'); } else { hazardLayer.clearLayers(); HAZ={};renderSafety(); cloud.profile=null; cloud.territory=null; cloud.weekBoard=null; }
      if(VIEW==='community') renderCommunity(); if(VIEW==='safety') renderSafety(); },0);
  });
  window.addEventListener('online',()=>flush());
}
buildCloudBox();
setupZoomCtl(); syncFogBtn();
go((location.hash||'').replace('#','')||'home',{keepScroll:true});
drawNameLabels(); drawZoneLabels(); drawHoofs();
if(S.rec&&S.rec.at){
  modal('Unfinished walk','<p>You started a walk on '+esc(dayLabel(new Date(S.rec.at).toISOString(),true))+' that wasn’t finished. Recording stops when the app closes.</p>',
    [['Resume recording','pri',()=>startGPS()],['Finish it now','',()=>finishRecording()],['Discard it','danger',()=>{ S.rec=null; saveNow(); }]]);
} loadNames(); setInterval(()=>{ if(document.visibilityState==='visible') loadNames(); }, 5*60*1000);

/* =====================================================================
   BOOT EXTRAS — restore from IndexedDB if localStorage was wiped,
   optional paths.geojson override, service worker
   ===================================================================== */
function refreshAll(){ buildSegments(); drawPaths(); drawHoofs(); drawZoneLabels(); render(); queueFog(); }
function setStatusIfIdle(){ if(watchId===null) setStatus('', 'Ready to explore · GPS off'); }
if(!localStorage.getItem(LS_KEY)){
  idb('kv','readonly',st=>st.get('state')).then(v=>{ if(v&&v.claimed){ S=Object.assign(DEF(),v); normalize(); refreshAll(); } });
}
if(location.protocol.indexOf('http')===0){
  fetch('paths.geojson',{cache:'no-cache'}).then(r=>r.ok?r.json():null).then(g=>{
    if(!g||!g.features) return;
    if(Array.isArray(g.dorms)){ DORM_LIST=g.dorms.filter(d=>typeof d==='string').slice(0,200); if(cloud.user){ buildCloudBox(); } }
    const custom=g.features.filter(f=>f.geometry&&f.geometry.type==='LineString').map((f,i)=>({
      id:(f.properties&&f.properties.id)||('x'+i), zone:ZONES.some(z=>z.id===(f.properties&&f.properties.zone))?f.properties.zone:'campus',
      name:(f.properties&&f.properties.name)||'Walkway', tags:(f.properties&&f.properties.tags)||[],
      official:(f.properties&&f.properties.named===true)||!GENERIC_NAMES.has((f.properties&&f.properties.name)||'Walkway'),
      pts:f.geometry.coordinates.map(c=>[c[1],c[0]])}));
    if(custom.length){ PATHS=custom; refreshAll(); drawNameLabels(); setStatusIfIdle(); if(VIEW==='community') renderCommunity(); }
  }).catch(()=>{});
  if('serviceWorker' in navigator) window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
}

// read-only hooks for debugging from the console (no way to fake movement)
window.RR={state:()=>JSON.parse(JSON.stringify(S)), progress, segCount:()=>SEGS.length, nudges:()=>NUDGES.map(n=>n.text), names:()=>JSON.parse(JSON.stringify(NAMES))};
})();
</script>
</body>
