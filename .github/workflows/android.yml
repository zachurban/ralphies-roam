name: Android app (Google Play)

# Builds the Play Store bundle (.aab) with Bubblewrap: a Trusted Web Activity that opens the live
# site full screen in Chrome. Run it from Actions → "Android app (Google Play)" → Run workflow.
# Needs two repository secrets (Settings → Secrets and variables → Actions):
#   ANDROID_KEYSTORE_B64       the upload key (buffprints-upload.jks), base64
#   ANDROID_KEYSTORE_PASSWORD  its password
# The signed bundle and a test APK are attached to the run as "buffprints-android".

on:
  workflow_dispatch:
    inputs:
      host:
        description: 'Domain the app lives at, no https://'
        required: true
        default: 'buffprints.app'
      version:
        description: 'Version name shown in the store (e.g. 1.0.0)'
        required: true
        default: '1.0.0'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - name: Check the site is live and owns the app
        run: |
          HOST="${{ inputs.host }}"
          curl -fsS "https://$HOST/" -o /dev/null || { echo "::error::https://$HOST/ is not reachable yet"; exit 1; }
          curl -fsS "https://$HOST/.well-known/assetlinks.json" | grep -q com.buffprints.app \
            || { echo "::error::https://$HOST/.well-known/assetlinks.json is missing or wrong"; exit 1; }
      - name: Prepare Bubblewrap
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          test -n "$KEYSTORE_B64" || { echo "::error::Add the ANDROID_KEYSTORE_B64 secret first"; exit 1; }
          npm i -g @bubblewrap/cli@1.27.0
          # Bubblewrap checks for a legacy "tools" folder in the SDK. GitHub's runners only ship
          # cmdline-tools, so point "tools" at them, then install the build-tools version it needs.
          test -e "$ANDROID_HOME/tools" || ln -s "$ANDROID_HOME/cmdline-tools/latest" "$ANDROID_HOME/tools"
          BT=$(node -p "require('$(npm root -g)/@bubblewrap/cli/node_modules/@bubblewrap/core/dist/lib/androidSdk/AndroidSdkTools.js').BUILD_TOOLS_VERSION" 2>/dev/null \
               || node -p "require('$(npm root -g)/@bubblewrap/core/dist/lib/androidSdk/AndroidSdkTools.js').BUILD_TOOLS_VERSION")
          echo "Bubblewrap needs build-tools $BT"
          yes | "$ANDROID_HOME/tools/bin/sdkmanager" --sdk_root="$ANDROID_HOME" "build-tools;$BT" "platform-tools" > /dev/null
          mkdir -p ~/.bubblewrap
          echo "{\"jdkPath\":\"$JAVA_HOME\",\"androidSdkPath\":\"$ANDROID_HOME\"}" > ~/.bubblewrap/config.json
          bubblewrap doctor
          echo "$KEYSTORE_B64" | base64 -d > android/upload.jks
          # Version code goes up with every run so each upload to Play is accepted.
          jq --arg h "${{ inputs.host }}" --arg v "${{ inputs.version }}" --argjson c "${{ github.run_number }}" \
            '.host=$h | .webManifestUrl=("https://"+$h+"/public/site.webmanifest") | .appVersion=$v | .appVersionCode=$c' \
            android/twa-manifest.json > /tmp/m.json && mv /tmp/m.json android/twa-manifest.json
          cat android/twa-manifest.json
      - name: Generate and build
        working-directory: android
        env:
          BUBBLEWRAP_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          BUBBLEWRAP_KEY_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          yes | bubblewrap update --skipVersionUpgrade
          yes | bubblewrap build --skipPwaValidation
          ls -la *.aab *.apk
      - uses: actions/upload-artifact@v4
        with:
          name: buffprints-android
          path: |
            android/app-release-bundle.aab
            android/app-release-signed.apk
          retention-days: 30
